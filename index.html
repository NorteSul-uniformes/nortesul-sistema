<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NorteSul</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--g:#1a4a1f;--g2:#2d7a35;--a:#e8d882;--s:#fff;--s2:#f2f7f2;--b:#d0dbd1;--m:#6a7a6b;
--r:#b92c2c;--br:#fceaea;--w:#8a5a00;--bw:#fff4db;--bl:#1a4a8a;--bb:#e8f0fb;--ok:#1a6b3a;--bg:#eaf4ee}
body{font-family:system-ui,sans-serif;background:#f0f5f0;font-size:13px;color:#1a1d23}
#ls{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0d2910,#1a4a1f)}
.lb{background:#fff;border-radius:12px;padding:32px;width:min(340px,94vw);box-shadow:0 16px 48px #0005}
.lb h1{font-size:18px;font-weight:800;color:var(--g);text-align:center;margin-bottom:4px}
.lb p{font-size:11px;color:var(--m);text-align:center;margin-bottom:20px}
#tb{background:var(--g);display:flex;align-items:center;padding:0 14px;position:sticky;top:0;z-index:99;min-height:44px;gap:10px}
#tb .brand{color:#fff;font-size:12px;font-weight:800;white-space:nowrap;padding-right:10px;border-right:1px solid #ffffff22}
#nav{display:flex;flex:1;overflow-x:auto}
.tab{padding:11px 12px;font-size:11px;font-weight:600;color:#ffffff99;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on,.tab:hover{color:#fff}.tab.on{border-bottom-color:var(--a)}
#tbr{display:flex;align-items:center;gap:6px;flex-shrink:0}
.chip{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700}
.chip.ca{background:var(--a);color:var(--g)}.chip.cs{background:#4a90d9;color:#fff}.chip.co{background:var(--g2);color:#fff}
.uname{background:#ffffff1e;color:#fff;padding:3px 9px;border-radius:20px;font-size:11px}
.out{background:#ffffff1e;color:#fff;border:none;padding:4px 9px;border-radius:4px;font-size:11px;cursor:pointer}
#mc{max-width:1160px;margin:0 auto;padding:12px}
.card{background:var(--s);border:1px solid var(--b);border-radius:8px;padding:13px;margin-bottom:10px}
.ct{font-size:12px;font-weight:700;color:var(--g);margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.r3{grid-template-columns:1fr 1fr 1fr}.r1{grid-template-columns:1fr}
.f{display:flex;flex-direction:column;gap:2px}
label{font-size:10px;color:var(--m);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
input,select,textarea{padding:6px 8px;border:1px solid var(--b);border-radius:4px;font-size:12px;background:var(--s);color:#1a1d23;font-family:inherit;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--g)}
input[readonly]{background:var(--s2)}
.btn{padding:6px 12px;font-size:12px;border-radius:4px;cursor:pointer;font-weight:700;border:none;font-family:inherit;display:inline-flex;align-items:center;gap:4px}
.btn+.btn{margin-left:4px}
.bp{background:var(--g);color:#fff}.ba{background:var(--a);color:var(--g)}
.bs{background:none;border:1px solid var(--b);color:#1a1d23}
.bg2{background:var(--bg);color:var(--ok)}.br2{background:var(--br);color:var(--r)}
.bw2{background:var(--bw);color:var(--w)}.sm{padding:3px 8px;font-size:11px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:5px 8px;font-size:10px;color:var(--m);font-weight:700;border-bottom:1px solid var(--b);background:var(--s2);text-align:left;text-transform:uppercase;white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--b);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfc}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700}
.bok{background:var(--bg);color:var(--ok)}.bwn{background:var(--bw);color:var(--w)}
.bred{background:var(--br);color:var(--r)}.bbl{background:var(--bb);color:var(--bl)}
.bgy{background:#f0f1f3;color:#555}.bnv{background:var(--g);color:#fff}.bpu{background:#ede6fb;color:#6b3fa0}
.alert{padding:7px 11px;border-radius:4px;font-size:12px;margin-bottom:8px}
.ai{background:var(--bb);color:var(--bl)}.aok{background:var(--bg);color:var(--ok)}.ar{background:var(--br);color:var(--r)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{padding:4px 11px;border-radius:20px;border:1px solid var(--b);font-size:12px;cursor:pointer;font-weight:600;background:var(--s)}
.tag.on{background:var(--g);color:#fff;border-color:var(--g)}
.sg{display:grid;gap:3px;margin-bottom:6px}
.inf{grid-template-columns:repeat(6,1fr)}.adu{grid-template-columns:repeat(8,1fr)}
.si{text-align:center;padding:3px 2px;border:1px solid var(--b);border-radius:3px;background:var(--s2)}
.slbl{font-size:9px;color:var(--m);font-weight:700}
.sinp{width:100%;border:1px solid var(--b);border-radius:2px;text-align:center;padding:2px 1px;font-size:12px;font-weight:700;background:var(--s)}
#modal{display:none;position:fixed;inset:0;background:#0007;z-index:200;overflow-y:auto;padding:14px}
.mbox{max-width:680px;margin:0 auto;background:var(--s);border-radius:8px;padding:16px;position:relative}
.mclose{position:absolute;top:8px;right:10px;background:none;border:none;font-size:16px;cursor:pointer;color:var(--m)}
.pcard{background:var(--s2);border:1px solid var(--b);border-radius:4px;padding:10px;margin-bottom:7px}
.metrics{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mc2{background:var(--s);border:1px solid var(--b);border-radius:6px;padding:10px 14px;flex:1;min-width:130px}
.lbl2{font-size:10px;color:var(--m);font-weight:700;text-transform:uppercase;margin-bottom:3px}
.val2{font-size:20px;font-weight:800;line-height:1}
.frow{display:flex;gap:6px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.sep{font-size:11px;font-weight:700;color:var(--m);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 6px}
.kb{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:10px;overflow-x:auto;align-items:start;padding-bottom:8px}
.kbc{background:var(--s2);border:1px solid var(--b);border-radius:8px;min-width:0}
.kbt{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-top:4px solid var(--g);border-radius:8px 8px 0 0;font-size:12px;font-weight:800;color:var(--g);background:var(--s)}
.kbl{padding:8px;max-height:72vh;overflow-y:auto}
.kbcard{background:var(--s);border:1px solid var(--b);border-radius:6px;padding:9px 10px;margin-bottom:8px}
.kbh{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px}
.kbcli{font-weight:700;font-size:12px}
.kbp{font-size:11px;color:var(--m);margin:3px 0}
.kbm{font-size:11px;color:var(--m);margin-top:3px}
.kbb{display:flex;gap:4px;margin-top:8px}
.kbvazio{font-size:11px;color:var(--m);text-align:center;padding:12px 4px}

function totPcs(){

function getProds(){
  var arr=[];
  document.querySelectorAll('.pcard').forEach(function(card){
    var ci=card.id.slice(2);
    var sel=g('pm'+ci);if(!sel||!sel.value)return;
    var opt=sel.options[sel.selectedIndex];
    var sz={inf:{},masc:{},fem:{}};var tot=0;
    var mapa={i:'inf',m:'masc',f:'fem'};
    card.querySelectorAll('.sinp').forEach(function(inp){
      var q=parseInt(inp.value)||0;if(q<=0)return;
      var m=/^([imf])\d+-(.+)$/.exec(inp.dataset.sz||'');if(!m)return;
      sz[mapa[m[1]]][m[2]]=q;tot+=q;
    });

}

    var hdr=document.createElement('div');hdr.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:12px';
    hdr.innerHTML='<b style="font-size:15px;color:var(--g)">Tarefas</b>';
    [['ativas','Ativas'],['historico','Histórico']].forEach(function(kl){var k=kl[0],l=kl[1];var b=document.createElement('button');b.className='btn sm '+(k===sub?'bp':'bs');b.textContent=l;b.onclick=function(){pgTar(k);};hdr.appendChild(b);});

      </div>
      <div class="row r3">
        <div class="f"><label>Prioridade (1=alta)</label><input type="number" id="tnp" value="1" min="1" max="10"></div>
        <div class="f"><label>Data agendada</label><input type="date" id="tnd" value="${hoje()}"></div>
        <div class="f"><label>Descrição</label><input id="tnds"></div>
      </div>
      <div class="frow"><button class="btn ba" id="btn-criar-tar">Criar tarefa</button></div>`;
    card.querySelector('#btn-criar-tar').onclick=criarTar;
    card.querySelector('#tnop').onchange=function(){
      if(!this.value)return;
      var o=this.options[this.selectedIndex],st=ETAPA_SETOR[o.dataset.et];

    if(pend.length){
      var tCard=document.createElement('div');tCard.className='card';tCard.style.padding='0';

        <div class="tw"><table><thead><tr><th>Prio</th><th>OP</th><th>Título</th><th>Setor</th><th>Data</th><th>Status</th><th>Ações</th></tr></thead><tbody id="tar-rows"></tbody></table></div>`;

        td.appendChild(bd);tbody.appendChild(tr);
      });
    }
  } else {
    var h=document.createElement('div');h.className='card';h.innerHTML=`<b style="font-size:15px;color:var(--g)">Minhas Tarefas — ${U.nome}</b>`;mc.appendChild(h);

    pend.forEach(t=>{

      var div=document.createElement('div');
      div.style.cssText=`background:var(--s);border:2px solid ${co};border-radius:7px;padding:13px;margin:8px 0;display:flex;align-items:flex-start;gap:11px`;
      div.innerHTML=`<span style="display:inline-flex;width:30px;height:30px;border-radius:50%;background:${co};color:#fff;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0">${t.prioridade}</span>
        <div style="flex:1"><b style="font-size:13px">${t.titulo}</b>${t.op_num?`<div style="font-size:11px;color:var(--m)">OP: ${t.op_num}</div>`:''}${t.descricao?`<div style="font-size:12px;color:var(--m)">${t.descricao}</div>`:''}${t.data_agendada?`<div style="font-size:11px;color:var(--m)">${dBR(t.data_agendada)}</div>`:''}</div>`;
      var bc=document.createElement('button');bc.className='btn bg2 sm';bc.textContent='Concluir';bc.onclick=()=>concTar(t.id,t.titulo);div.appendChild(bc);mc.appendChild(div);
    });

async function concTar(id,titulo){
  var obsConc=await new Promise(function(res){
    openM('<b style="font-size:14px;color:var(--g)">Concluir tarefa</b><div style="margin:10px 0 4px;font-size:12px;color:var(--m)">'+titulo+'</div><div class="f" style="margin-top:12px"><label>Observação (opcional)</label><textarea id="obs-conc" rows="3" placeholder="Ex: Peças separadas, aguardando retirada..."></textarea></div><div class="frow"><button class="btn bs" id="btn-canc-conc">Cancelar</button><button class="btn ba" id="btn-conf-conc">Confirmar conclusão</button></div>');
    window._concRes=res;
    g('btn-canc-conc').onclick=function(){closeM();res(null);};
    g('btn-conf-conc').onclick=function(){var obs=v('obs-conc');closeM();res(obs);};
  });
  if(obsConc===null)return;
  var {data:tarDet}=await DB.from('tarefas').select('op_num,setor').eq('id',id).single();
  await DB.from('tarefas').update({status:'concluida',concluida_por:U.nome,concluida_em:new Date().toISOString(),obs_conclusao:obsConc||null}).eq('id',id);
  if(tarDet&&tarDet.op_num){
    var {data:opAt}=await DB.from('ops').select('etapa,num,cliente').eq('num',tarDet.op_num).single();
    if(opAt&&opAt.etapa!=='Concluída'){
      var etIdx=ETAPAS.indexOf(opAt.etapa);var proxOpts=ETAPAS.slice(etIdx+1);
      if(proxOpts.length){
        var optsH=proxOpts.map(function(e){return '<option value="'+e+'">'+e+'</option>';}).join('');
        openM('<b style="font-size:14px;color:var(--g)">Encaminhar OP '+opAt.num+'</b><p style="font-size:12px;color:var(--m);margin:8px 0 14px">Para qual etapa vai agora?</p><div class="f" style="margin-bottom:14px"><label>Próxima etapa</label><select id="prox-et">'+optsH+'</select></div><div class="frow"><button class="btn bs" id="btn-sc">Só concluir</button><button class="btn ba" id="btn-enc">Encaminhar e criar tarefa</button></div>');
        g('btn-sc').onclick=function(){closeM();_compTar(titulo,obsConc,tarDet&&tarDet.setor);pgTar();};
        g('btn-enc').onclick=async function(){
          var ne=v('prox-et');
          await DB.from('ops').update({etapa:ne}).eq('num',opAt.num);
          var ns=ETAPA_SETOR[ne]||null;
          if(ns)await DB.from('tarefas').insert({op_num:opAt.num,titulo:ne+' — OP '+opAt.num+' ('+opAt.cliente+')',descricao:'Avançada de '+opAt.etapa+' para '+ne+'.',setor:ns,prioridade:2,data_agendada:hoje(),status:'pendente',criado_por:U.nome});
          closeM();alert('OP '+opAt.num+' encaminhada para '+ne+'.'+(ns?'':' Ela aparece na Expedição para retirada.'));_compTar(titulo,obsConc,tarDet&&tarDet.setor);pgTar();
        };return;
      }
    }
  }
  _compTar(titulo,obsConc,tarDet&&tarDet.setor);pgTar();}

// ━━ NOVA OP / EDITAR OP (mesmo formulário) ━━
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var SZ_INF=['1A','2-3A','4-5A','6-7A','8-9A','10-11A'];
var SZ_ADU=['PP','P','MP','M','G','GG','XGG','EX'];
var _eop=null;

// Aceita os formatos antigos e o novo ({inf:{},masc:{},fem:{}}) e devolve sempre o novo
function normSizes(s){
  var o={inf:{},masc:{},fem:{}};if(!s)return o;
  var add=function(k,t,q){q=parseInt(q)||0;if(q>0)o[k][t]=q;};
  if(s.inf||s.masc||s.fem){
    ['inf','masc','fem'].forEach(function(k){Object.keys(s[k]||{}).forEach(function(t){add(k,t,s[k][t]);});});
    return o;
  }
  var map={i:'inf',m:'masc',f:'fem'};
  Object.keys(s).forEach(function(key){
    var m=/^([imf])\d+-(.+)$/.exec(key);
    if(m){add(map[m[1]],m[2],s[key]);return;}
    if(SZ_INF.indexOf(key)>=0){add('inf',key,s[key]);return;}
    var l=/^([mf])(PP|P|MP|M|G|GG|XGG|EX)$/.exec(key);
    if(l)add(l[1]==='m'?'masc':'fem',l[2],s[key]);
  });
  return o;
}
function szCount(o){var n=0;['inf','masc','fem'].forEach(function(k){Object.keys(o[k]).forEach(function(t){n+=o[k][t];});});return n;}
function _sigProds(a){return JSON.stringify((a||[]).map(function(p){return [p.nome||'',parseInt(p.quantidade)||0,p.obs||'',normSizes(p.sizes)];}));}

function getSz(){
  var o={};
  document.querySelectorAll('.sinp').forEach(function(inp){var q=parseInt(inp.value)||0;if(q>0&&inp.dataset.sz)o[inp.dataset.sz]=q;});
  return o;
}

function addProd(prods,preset){
  _pc++;var i=_pc;
  var pOpts=prods.map(function(p){return '<option value="'+p.id+'" data-n="'+esc(p.nome)+'" data-v="'+(p.valor_venda||0)+'">'+esc(p.nome)+'</option>';}).join('');
  var div=document.createElement('div');div.className='pcard';div.id='pc'+i;
  function grade(pfx,arr){return arr.map(function(s){return '<div class="si"><div class="slbl">'+s+'</div><input class="sinp" type="number" min="0" value="0" data-sz="'+pfx+i+'-'+s+'" oninput="totPcs()"></div>';}).join('');}
  div.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b id="pt'+i+'" style="font-size:14px;color:var(--g)">Produto</b><button class="btn br2 sm" id="rem'+i+'">Remover</button></div>'+
    '<div class="row" style="margin-bottom:10px"><div class="f"><label>Modelo *</label><select id="pm'+i+'"><option value="">Selecione...</option>'+pOpts+'</select></div>'+
    '<div class="f"><label>Observação do produto</label><input id="po'+i+'" placeholder="Ex: Manga longa, personalização nas costas..."></div></div>'+
    '<div style="font-size:10px;font-weight:700;color:var(--m);margin-bottom:4px">INFANTIL</div><div class="sg inf" style="margin-bottom:8px">'+grade('i',SZ_INF)+'</div>'+
    '<div style="font-size:10px;font-weight:700;color:var(--m);margin-bottom:4px">ADULTO MASCULINO</div><div class="sg adu" style="margin-bottom:8px">'+grade('m',SZ_ADU)+'</div>'+
    '<div style="font-size:10px;font-weight:700;color:var(--m);margin-bottom:4px">ADULTO FEMININO</div><div class="sg adu" style="margin-bottom:8px">'+grade('f',SZ_ADU)+'</div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;padding-top:6px;border-top:1px solid var(--b)"><span style="font-size:11px;font-weight:700;color:var(--m)">TOTAL DESTE PRODUTO</span><span style="font-size:18px;font-weight:900;color:var(--g)" id="ptot'+i+'">0</span></div>';
  div.querySelector('#rem'+i).onclick=function(){div.remove();totPcs();renumProds();};
  div.querySelector('#pm'+i).onchange=renumProds;
  g('plist').appendChild(div);

  if(preset){
    var sel=g('pm'+i),achou=false,k;
    if(preset.produto_id){
      for(k=0;k<sel.options.length;k++){if(sel.options[k].value===String(preset.produto_id)){achou=true;sel.selectedIndex=k;break;}}
    }
    if(!achou&&preset.nome){
      for(k=0;k<sel.options.length;k++){if(sel.options[k].dataset.n===preset.nome){achou=true;sel.selectedIndex=k;break;}}
    }
    if(!achou&&(preset.produto_id||preset.nome)){
      var op=document.createElement('option');
      op.value=preset.produto_id||'sem-id';op.dataset.n=preset.nome||'';op.dataset.v=preset.valor_venda||0;
      op.textContent=(preset.nome||'Produto')+' (fora do cadastro)';
      sel.appendChild(op);sel.selectedIndex=sel.options.length-1;
    }
    g('po'+i).value=preset.obs||'';
    var ns=normSizes(preset.sizes),pf={inf:'i',masc:'m',fem:'f'};
    Object.keys(pf).forEach(function(kk){
      Object.keys(ns[kk]).forEach(function(t){
        var inp=div.querySelector('[data-sz="'+pf[kk]+i+'-'+t+'"]');if(inp)inp.value=ns[kk][t];
      });
    });
  }
  renumProds();totPcs();
}

async function salvarOP(){
  var op=_eop;
  var cli=v('ocli').trim();
  if(!cli){alert('Informe o cliente.');return;}
  var ruim=null;
  document.querySelectorAll('.pcard').forEach(function(card,ix){
    var ci=card.id.slice(2),sel=g('pm'+ci),sub=0;
    card.querySelectorAll('.sinp').forEach(function(inp){sub+=parseInt(inp.value)||0;});
    if(sub>0&&(!sel||!sel.value)&&!ruim)ruim='Selecione o modelo do Produto '+(ix+1)+'.';
  });
  if(ruim){alert(ruim);return;}
  var produtos=getProds(),tot=0;
  produtos.forEach(function(p){tot+=p.quantidade;});
  if(!tot){alert('Informe ao menos uma peça nos tamanhos.');return;}

  var facEl=g('ofac'),facId=facEl.value||'';
  var facNome=facId?(facEl.options[facEl.selectedIndex].dataset.n||''):'';
  var dados={
    cliente:cli,entrega:v('oent')||null,personalizacao:_ps,
    faccionista_id:facId||null,faccionista_nome:facNome,
    envio_costura:v('oenv')||null,retorno_costura:v('oret')||null,
    tecido:v('otec'),cor:v('ocor'),gola:v('ogola'),punho:v('opunho'),
    abertura:v('oaber'),cobre:v('ocobre'),bolso:v('obolso'),obs:v('oobs-geral'),arte:v('oarte'),
    total_pecas:tot,sizes:getSz(),produtos:produtos
  };
  var res,alt=[];
  if(op){
    dados.vendedor=v('ovend').trim()||op.vendedor;
    dados.etapa=v('oetapa')||op.etapa;
    dados.retirado=v('oretirado')==='1';
    dados.data_retirada=dados.retirado?(op.data_retirada||new Date().toISOString()):null;
    ['cliente','entrega','vendedor','personalizacao','faccionista_nome','envio_costura','retorno_costura','tecido','cor','gola','punho','abertura','cobre','bolso','obs','arte','etapa'].forEach(function(k){
      var a=op[k]==null?'':String(op[k]),b=dados[k]==null?'':String(dados[k]);
      if(a!==b)alt.push(k);
    });
    if(_sigProds(op.produtos)!==_sigProds(dados.produtos))alt.push('produtos');
    if(!!op.retirado!==!!dados.retirado)alt.push('retirado');
    res=await DB.from('ops').update(dados).eq('id',op.id);
  }else{
    dados.num=v('on');dados.vendedor=U.nome;dados.etapa='Corte';dados.obs_etapas={};dados.retirado=false;
    res=await DB.from('ops').insert(dados);
  }
  if(res.error){alert('Erro: '+res.error.message);return;}
  if(op){
    await au('EDITOU_OP','ops',op.num,{cliente:cli,campos:alt.join(', ')||'nenhum'});
    alert('OP '+op.num+' atualizada!');go('kb');
  }else{
    await au('CRIOU_OP','ops',dados.num,{cliente:cli,total_pecas:tot});
    alert('OP '+dados.num+' criada!');pgOP();
  }
}

// ━━ OP's EM ABERTO (KANBAN) ━━
var KB=[
  {t:'Corte',et:['Corte'],cor:'#1a4a8a'},
  {t:'Personalização',et:['Personalização','Silk'],cor:'#8a5a00'},
  {t:'Costura',et:['Costura'],cor:'#6b3fa0'},
  {t:'Revisão',et:['Revisão'],cor:'#555555'},
  {t:'Finalizada / Entregue',et:['Concluída'],cor:'#1a6b3a'}
];
var _kbOps=[],_kbBusca='',_kbAntigas=false;

async function pgKb(){
  var mc=g('mc');mc.innerHTML=ld();
  var r=await DB.from('ops').select('id,num,cliente,entrega,etapa,personalizacao,faccionista_nome,total_pecas,retirado,data_retirada,produtos,criada_em').order('criada_em',{ascending:false});
  if(r.error){mc.innerHTML='<div class="alert ar">Erro ao carregar as OPs: '+esc(r.error.message)+'</div>';return;}
  _kbOps=r.data||[];_kbBusca='';_kbAntigas=false;
  mc.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <div><b style="font-size:15px;color:var(--g)">OP's em aberto</b><span id="kb-res" style="font-size:11px;color:var(--m);margin-left:8px"></span></div>
      <input id="kb-q" placeholder="Buscar por OP ou cliente..." style="max-width:260px">
    </div>
    <div id="kb-board"></div>`;
  g('kb-q').oninput=function(){_kbBusca=this.value.trim().toLowerCase();kbDesenhar();};
  kbDesenhar();
}

function kbDesenhar(){
  var hojeS=hoje(),lim=Date.now()-30*864e5,ultimo=KB.length-1;
  var cols=KB.map(function(c){return {def:c,items:[],ocultas:0};});
  var emProd=0;
  _kbOps.forEach(function(o){
    if(_kbBusca&&((o.num||'')+' '+(o.cliente||'')).toLowerCase().indexOf(_kbBusca)<0)return;
    var idx=0;
    KB.forEach(function(c,ix){if(c.et.indexOf(o.etapa)>=0)idx=ix;});
    if(idx!==ultimo)emProd++;
    if(idx===ultimo&&o.retirado&&!_kbAntigas&&!_kbBusca){
      if(new Date(o.data_retirada||o.criada_em).getTime()<lim){cols[idx].ocultas++;return;}
    }
    cols[idx].items.push(o);
  });
  cols.forEach(function(col,ix){
    if(ix<ultimo){
      col.items.sort(function(a,b){var x=a.entrega||'9999',y=b.entrega||'9999';return x<y?-1:(x>y?1:0);});
    }else{
      col.items.sort(function(a,b){
        var d=(a.retirado?1:0)-(b.retirado?1:0);if(d)return d;
        return String(b.data_retirada||b.criada_em||'').localeCompare(String(a.data_retirada||a.criada_em||''));
      });
    }
  });

  var res=g('kb-res');if(res)res.textContent=emProd+' em produção';
  var board=g('kb-board');board.innerHTML='';
  var grid=document.createElement('div');grid.className='kb';
  cols.forEach(function(col,ix){
    var box=document.createElement('div');box.className='kbc';
    var ht=document.createElement('div');ht.className='kbt';ht.style.borderTopColor=col.def.cor;
    ht.innerHTML='<span>'+esc(col.def.t)+'</span><span class="badge bgy">'+col.items.length+'</span>';
    var lst=document.createElement('div');lst.className='kbl';
    if(!col.items.length)lst.innerHTML='<div class="kbvazio">Nenhuma OP</div>';
    col.items.forEach(function(o){lst.appendChild(kbCard(o,hojeS));});
    if(col.ocultas){
      var mb=document.createElement('button');mb.className='btn bs sm';mb.style.width='100%';
      mb.textContent='Mostrar '+col.ocultas+' entregue(s) há mais de 30 dias';
      mb.onclick=function(){_kbAntigas=true;kbDesenhar();};
      lst.appendChild(mb);
    }
    box.appendChild(ht);box.appendChild(lst);grid.appendChild(box);
  });
  board.appendChild(grid);
}

function kbCard(o,hojeS){
  var d=document.createElement('div');d.className='kbcard';
  var fim=o.etapa==='Concluída';
  var atrasada=o.entrega&&!fim&&o.entrega<hojeS;
  var prods=(o.produtos||[]).map(function(p){return esc(p.nome)+(p.quantidade?' ×'+p.quantidade:'');}).join('<br>');
  var rodape='';
  if(fim){
    rodape=o.retirado
      ?'<span class="badge bok">Entregue'+(o.data_retirada?' em '+new Date(o.data_retirada).toLocaleDateString('pt-BR'):'')+'</span>'
      :'<span class="badge bwn">Aguardando retirada</span>';
  }
  d.innerHTML='<div class="kbh"><b>'+esc(o.num)+'</b><span class="badge '+(atrasada?'bred':'bgy')+'">'+(o.entrega?(atrasada?'Atrasada · ':'Entrega ')+dBR(o.entrega):'Sem data')+'</span></div>'+
    '<div class="kbcli">'+esc(o.cliente)+'</div>'+
    (prods?'<div class="kbp">'+prods+'</div>':'')+
    '<div class="kbm">'+(o.total_pecas||0)+' peças'+((o.personalizacao&&o.personalizacao!=='Nenhuma')?' · '+esc(o.personalizacao):'')+'</div>'+
    (o.faccionista_nome?'<div class="kbm">Faccionista: '+esc(o.faccionista_nome)+'</div>':'')+
    (rodape?'<div class="kbm">'+rodape+'</div>':'')+
    '<div class="kbb"></div>';
  var bar=d.querySelector('.kbb');
  var be=document.createElement('button');be.className='btn bs sm';be.textContent='Editar';
  be.onclick=function(){g('mc').innerHTML=ld();pgOP(o.id);};
  var bp=document.createElement('button');bp.className='btn bs sm';bp.textContent='PDF';
  bp.onclick=function(){printOP(o.id);};
  bar.appendChild(be);bar.appendChild(bp);
  return d;
}

// ━━ CADASTRO: PRODUTOS ━━

    <div class="row r1"><div class="f"><label>Descrição (max 200)</label><textarea id="pd" maxlength="200" rows="2"></textarea></div></div>

async function saveProd(){
  var n=v('pn').trim();if(!n){alert('Informe o nome.');return;}
  var r=await DB.from('produtos').insert({nome:n,descricao:v('pd'),valor_venda:fv('pv'),insumos:[]});
  if(r.error){alert('Erro: '+r.error.message);return;}
  alert('Produto salvo!');pgCad('prod');
}

// ━━ CADASTRO: FACCIONISTAS (telefone, endereço e tabela de valores) ━━
var ACEITA_ANEXO='.pdf,.xlsx,.xls,.csv,.doc,.docx,.png,.jpg,.jpeg';
async function anexarTabela(facId,file){
  var path='fac/'+facId+'/'+Date.now()+'-'+file.name.replace(/[^\w.\-]+/g,'_');
  var up=await DB.storage.from('tabelas').upload(path,file,{upsert:false,contentType:file.type||undefined});
  if(up.error)return {erro:up.error.message};
  var u=await DB.from('faccionistas').update({tabela_path:path,tabela_nome:file.name}).eq('id',facId);
  if(u.error)return {erro:u.error.message};
  return {ok:true};
}
async function abrirTabela(path){
  var w=window.open('','_blank');
  var r=await DB.storage.from('tabelas').createSignedUrl(path,300);
  if(r.error||!r.data){if(w)w.close();alert('Não foi possível abrir o arquivo: '+(r.error?r.error.message:'sem resposta'));return;}
  if(w)w.location.href=r.data.signedUrl;else window.open(r.data.signedUrl,'_blank');
}
async function addFac(){
  var n=v('fn').trim();if(!n){alert('Informe o nome.');return;}
  var f=g('fanexo').files[0];
  if(f&&f.size>5*1024*1024){alert('O anexo passa de 5 MB.');return;}
  var r=await DB.from('faccionistas').insert({nome:n,telefone:v('ftel').trim()||null,endereco:v('fend').trim()||null}).select().single();
  if(r.error){alert('Erro: '+r.error.message);return;}
  if(f){
    var a=await anexarTabela(r.data.id,f);
    if(a.erro){alert('Faccionista salva, mas o anexo falhou: '+a.erro);pgCad('fac');return;}
  }
  alert('Faccionista adicionada!');pgCad('fac');
}
function editFac(f){
  _mid=f.id;
  openM('<b style="font-size:14px;color:var(--g)">Editar faccionista</b>'+
    '<div class="row r1" style="margin-top:12px"><div class="f"><label>Nome *</label><input id="efn" value="'+esc(f.nome)+'"></div></div>'+
    '<div class="row"><div class="f"><label>Telefone</label><input id="eftel" value="'+esc(f.telefone)+'"></div><div class="f"><label>Endereço</label><input id="efend" value="'+esc(f.endereco)+'"></div></div>'+
    '<div style="margin:6px 0 8px;font-size:12px">'+(f.tabela_path?'Tabela atual: <b>'+esc(f.tabela_nome||'arquivo')+'</b> <button class="btn bs sm" id="btn-ver-tab">Abrir</button>':'<span style="color:var(--m)">Nenhuma tabela de valores anexada.</span>')+'</div>'+
    '<div class="f"><label>'+(f.tabela_path?'Substituir tabela de valores':'Anexar tabela de valores')+'</label><input type="file" id="efanexo" accept="'+ACEITA_ANEXO+'"><small style="color:var(--m);font-size:10px">Até 5 MB. A tabela anterior continua guardada.</small></div>'+
    '<div class="frow"><button class="btn bs" onclick="closeM()">Cancelar</button><button class="btn ba" id="btn-sfac">Salvar</button></div>');
  if(f.tabela_path)g('btn-ver-tab').onclick=function(){abrirTabela(f.tabela_path);};
  g('btn-sfac').onclick=async function(){
    var n=v('efn').trim();if(!n){alert('Informe o nome.');return;}
    var file=g('efanexo').files[0];
    if(file&&file.size>5*1024*1024){alert('O anexo passa de 5 MB.');return;}
    var u=await DB.from('faccionistas').update({nome:n,telefone:v('eftel').trim()||null,endereco:v('efend').trim()||null}).eq('id',_mid);
    if(u.error){alert('Erro: '+u.error.message);return;}
    if(file){
      var a=await anexarTabela(_mid,file);
      if(a.erro){closeM();alert('Dados salvos, mas o anexo falhou: '+a.erro);pgCad('fac');return;}
    }
    closeM();alert('Faccionista atualizada!');pgCad('fac');
  };
}
async function cFac(mc){
  var rs=await Promise.all([DB.from('faccionistas').select('*').order('nome'),DB.from('ops').select('faccionista_id,total_pecas,num')]);
  var facs=rs[0].data||[],ops=rs[1].data||[];
  var byF={};
  ops.forEach(function(o){if(o.faccionista_id){if(!byF[o.faccionista_id])byF[o.faccionista_id]={pcs:0,ops:[]};byF[o.faccionista_id].pcs+=o.total_pecas||0;byF[o.faccionista_id].ops.push(o.num);}});

  var form=document.createElement('div');form.className='card';
  form.innerHTML='<div class="ct">Adicionar Faccionista</div>'+
    '<div class="row r1"><div class="f"><label>Nome *</label><input id="fn" placeholder="Nome"></div></div>'+
    '<div class="row"><div class="f"><label>Telefone</label><input id="ftel" placeholder="(00) 00000-0000"></div><div class="f"><label>Endereço</label><input id="fend" placeholder="Rua, número, bairro, cidade"></div></div>'+
    '<div class="row r1"><div class="f"><label>Tabela de valores (anexo)</label><input type="file" id="fanexo" accept="'+ACEITA_ANEXO+'"><small style="color:var(--m);font-size:10px">Até 5 MB. Usada para calcular a folha da costureira.</small></div></div>'+
    '<div class="frow"><button class="btn ba" id="btn-fac">Adicionar</button></div>';
  form.querySelector('#btn-fac').onclick=addFac;

  var lista=document.createElement('div');lista.className='card';lista.style.padding='0';
  lista.innerHTML='<div style="padding:8px 12px;border-bottom:1px solid var(--b);font-size:12px;font-weight:700;color:var(--g)">Faccionistas ('+facs.length+')</div>'+
    '<div class="tw"><table><thead><tr><th>Nome</th><th>Contato</th><th>Tabela de valores</th><th>Peças</th><th>OPs</th><th></th></tr></thead><tbody id="fac-rows"></tbody></table></div>';
  mc.appendChild(form);mc.appendChild(lista);

  var tbody=lista.querySelector('#fac-rows');
  facs.forEach(function(f){
    var d=byF[f.id]||{pcs:0,ops:[]};
    var tr=document.createElement('tr');
    tr.innerHTML='<td><b>'+esc(f.nome)+'</b></td>'+
      '<td style="font-size:11px">'+(f.telefone?esc(f.telefone):'--')+(f.endereco?'<br><span style="color:var(--m)">'+esc(f.endereco)+'</span>':'')+'</td>'+
      '<td></td>'+
      '<td style="font-weight:700;color:var(--g)">'+d.pcs+'</td>'+
      '<td style="font-size:11px;color:var(--m)">'+(d.ops.slice(0,5).join(', ')||'--')+'</td><td></td>';
    var tds=tr.querySelectorAll('td');
    if(f.tabela_path){
      var bv=document.createElement('button');bv.className='btn bs sm';bv.textContent='Abrir '+(f.tabela_nome||'tabela');
      bv.onclick=function(){abrirTabela(f.tabela_path);};tds[2].appendChild(bv);
    }else{tds[2].innerHTML='<span style="color:var(--m);font-size:11px">sem anexo</span>';}
    var acoes=tds[5];
    var be=document.createElement('button');be.className='btn bs sm';be.textContent='Editar';be.onclick=function(){editFac(f);};acoes.appendChild(be);
    acoes.appendChild(document.createTextNode(' '));
    var bd=document.createElement('button');bd.className='btn br2 sm';bd.textContent='Excluir';
    bd.onclick=function(){if(!confirm('Excluir '+f.nome+'?'))return;DB.from('faccionistas').delete().eq('id',f.id).then(function(){pgCad('fac');});};
    acoes.appendChild(bd);
    tbody.appendChild(tr);
  });
}

// ━━ ENTRADA NO SISTEMA ━━
async function mostrarAvisos(){
  var r=await DB.from('avisos').select('*').eq('ativo',true).order('criado_em',{ascending:false}).limit(5);

}
function entrar(avisos){
  g('ls').style.display='none';g('sys').style.display='block';
  buildNav();go(U.nivel==='operacional'?'tar':'op');
  if(avisos)setTimeout(mostrarAvisos,400);

// redefinição de senha (link enviado por e-mail)
function novaSenhaModal(){
  g('ls').style.display='flex';g('sys').style.display='none';
  openM('<b style="font-size:14px;color:var(--g)">Defina sua nova senha</b><div class="row r1" style="margin-top:12px"><div class="f"><label>Nova senha (mín. 6)</label><input type="password" id="rn1"></div></div><div class="row r1"><div class="f"><label>Repita</label><input type="password" id="rn2"></div></div><div id="rn-err" class="alert ar" style="display:none"></div><div class="frow"><button class="btn ba" id="btn-rn">Salvar</button></div>');
  g('btn-rn').onclick=async function(){
    var a=v('rn1'),b=v('rn2'),er=g('rn-err');
    if(a.length<6){er.style.display='block';er.textContent='Mínimo 6 caracteres.';return;}
    if(a!==b){er.style.display='block';er.textContent='Senhas não coincidem.';return;}
    var rr=await DB.auth.updateUser({password:a});
    if(rr.error){er.style.display='block';er.textContent='Erro: '+rr.error.message;return;}
    closeM();try{await DB.auth.signOut();}catch(e){}
    history.replaceState(null,'',location.pathname);
    alert('Senha alterada! Entre com a nova senha.');
  };
}
var _recup=/type=recovery/.test(location.hash);
DB.auth.onAuthStateChange(function(ev){if(ev==='PASSWORD_RECOVERY'){_recup=true;novaSenhaModal();}});

// init
window.onload=async function(){
  if(_recup){novaSenhaModal();return;}
  if(await loadS()){rst();entrar(false);}else g('le').focus();
};
