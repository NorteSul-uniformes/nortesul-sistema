<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NorteSul</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--g:#1a4a1f;--g2:#2d7a35;--a:#e8d882;--s:#fff;--s2:#f2f7f2;--b:#d0dbd1;--m:#6a7a6b;
--r:#b92c2c;--br:#fceaea;--w:#8a5a00;--bw:#fff4db;--bl:#1a4a8a;--bb:#e8f0fb;
--ok:#1a6b3a;--bg:#eaf4ee;--pu:#6b3fa0;--bp:#ede6fb}
body{font-family:system-ui,sans-serif;background:#f0f5f0;font-size:13px;color:#1a1d23}
/* login */
#ls{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0d2910,#1a4a1f)}
.lb{background:#fff;border-radius:12px;padding:32px;width:min(340px,94vw);box-shadow:0 16px 48px #0005}
.lb h1{font-size:18px;font-weight:800;color:var(--g);text-align:center;margin-bottom:4px}
.lb p{font-size:11px;color:var(--m);text-align:center;margin-bottom:20px}
/* topbar */
#tb{background:var(--g);display:flex;align-items:center;padding:0 14px;position:sticky;top:0;z-index:99;min-height:44px;gap:10px}
#tb .brand{color:#fff;font-size:12px;font-weight:800;white-space:nowrap;padding-right:10px;border-right:1px solid #ffffff22}
#nav{display:flex;flex:1;overflow-x:auto;gap:0}
.tab{padding:11px 12px;font-size:11px;font-weight:600;color:#ffffff99;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on,.tab:hover{color:#fff}.tab.on{border-bottom-color:var(--a)}
#tbr{display:flex;align-items:center;gap:6px;flex-shrink:0}
.chip{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700}
.chip.a{background:var(--a);color:var(--g)}.chip.s{background:#4a90d9;color:#fff}.chip.o{background:var(--g2);color:#fff}
.uname{background:#ffffff1e;color:#fff;padding:3px 9px;border-radius:20px;font-size:11px}
.out{background:#ffffff1e;color:#fff;border:none;padding:4px 9px;border-radius:4px;font-size:11px;cursor:pointer}
/* main */
#mc{max-width:1160px;margin:0 auto;padding:12px}
/* cards */
.card{background:var(--s);border:1px solid var(--b);border-radius:8px;padding:13px;margin-bottom:10px}
.ct{font-size:12px;font-weight:700;color:var(--g);margin-bottom:10px}
/* grid */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
/* forms */
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.row.r3{grid-template-columns:1fr 1fr 1fr}
.row.r1{grid-template-columns:1fr}
.f{display:flex;flex-direction:column;gap:2px}
label{font-size:10px;color:var(--m);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
input,select,textarea{padding:6px 8px;border:1px solid var(--b);border-radius:4px;font-size:12px;background:var(--s);color:#1a1d23;font-family:inherit;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--g)}
input[readonly]{background:var(--s2)}
/* buttons */
.btn{padding:6px 12px;font-size:12px;border-radius:4px;cursor:pointer;font-weight:700;border:none;font-family:inherit}
.btn+.btn{margin-left:4px}
.bp{background:var(--g);color:#fff}.ba{background:var(--a);color:var(--g)}
.bs{background:none;border:1px solid var(--b);color:#1a1d23}
.bg{background:var(--bg);color:var(--ok)}.br2{background:var(--br);color:var(--r)}
.bw2{background:var(--bw);color:var(--w)}
.sm{padding:3px 8px;font-size:11px}
/* table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:5px 8px;font-size:10px;color:var(--m);font-weight:700;border-bottom:1px solid var(--b);background:var(--s2);text-align:left;text-transform:uppercase;white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--b);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfc}
/* badge */
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700}
.bok{background:var(--bg);color:var(--ok)}.bwn{background:var(--bw);color:var(--w)}
.bred{background:var(--br);color:var(--r)}.bbl{background:var(--bb);color:var(--bl)}
.bgy{background:#f0f1f3;color:#555}.bnv{background:var(--g);color:#fff}.bpu{background:var(--bp);color:var(--pu)}
/* alert */
.alert{padding:7px 11px;border-radius:4px;font-size:12px;margin-bottom:8px}
.ai{background:var(--bb);color:var(--bl)}.aw{background:var(--bw);color:var(--w)}
.ar{background:var(--br);color:var(--r)}.aok{background:var(--bg);color:var(--ok)}
/* tags */
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{padding:4px 11px;border-radius:20px;border:1px solid var(--b);font-size:12px;cursor:pointer;font-weight:600;background:var(--s)}
.tag.on{background:var(--g);color:#fff;border-color:var(--g)}
/* tamanhos */
.sg{display:grid;gap:3px;margin-bottom:6px}
.sg.inf{grid-template-columns:repeat(6,1fr)}.sg.adu{grid-template-columns:repeat(8,1fr)}
.si{text-align:center;padding:3px 2px;border:1px solid var(--b);border-radius:3px;background:var(--s2)}
.slbl{font-size:9px;color:var(--m);font-weight:700}
.sinp{width:100%;border:1px solid var(--b);border-radius:2px;text-align:center;padding:2px 1px;font-size:12px;font-weight:700;background:var(--s)}
/* modal */
#modal{display:none;position:fixed;inset:0;background:#0007;z-index:200;overflow-y:auto;padding:14px}
.mbox{max-width:680px;margin:0 auto;background:var(--s);border-radius:8px;padding:16px;position:relative}
.mclose{position:absolute;top:8px;right:10px;background:none;border:none;font-size:16px;cursor:pointer;color:var(--m)}
/* pcard */
.pcard{background:var(--s2);border:1px solid var(--b);border-radius:4px;padding:10px;margin-bottom:7px}
/* metrics */
.metrics{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mc2{background:var(--s);border:1px solid var(--b);border-radius:6px;padding:10px 14px;flex:1;min-width:130px}
.mc2 .lbl2{font-size:10px;color:var(--m);font-weight:700;text-transform:uppercase;margin-bottom:3px}
.mc2 .val2{font-size:20px;font-weight:800;line-height:1}
/* misc */
.frow{display:flex;gap:6px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.sep{font-size:11px;font-weight:700;color:var(--m);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 6px}
@media(max-width:680px){.g2,.g3,.row,.row.r3{grid-template-columns:1fr}.sg.adu{grid-template-columns:repeat(4,1fr)}.tab{padding:9px 8px;font-size:10px}}
</style>
</head>
<body>

<div id="ls">
<div class="lb">
  <svg width="48" height="48" viewBox="0 0 64 64" style="display:block;margin:0 auto 12px"><circle cx="32" cy="32" r="31" fill="#1a4a1f" stroke="#e8d882" stroke-width="3"/><ellipse cx="32" cy="32" rx="22" ry="22" fill="#2d7a35"/><path d="M14 32Q22 18 32 22Q42 26 50 32Q42 46 32 42Q22 38 14 32Z" fill="#1a4a1f" opacity=".5"/><text x="32" y="39" font-family="Arial Black,Arial" font-weight="900" font-size="20" fill="#e8d882" text-anchor="middle">NS</text></svg>
  <h1>NorteSul Uniformes</h1>
  <p>Sistema de Gestão</p>
  <div class="f" style="margin-bottom:10px"><label>Email</label><input id="le" type="text" onkeydown="if(event.key==='Enter')login()"></div>
  <div class="f" style="margin-bottom:12px"><label>Senha</label><input id="ls2" type="password" onkeydown="if(event.key==='Enter')login()"></div>
  <button class="btn bp" style="width:100%" id="lbtn" onclick="login()">Entrar</button>
  <div class="alert ar" id="lerr" style="display:none;margin-top:10px"></div>
</div>
</div>

<div id="sys" style="display:none">
<div id="tb">
  <span class="brand">NorteSul</span>
  <div id="nav"></div>
  <div id="tbr">
    <span class="chip" id="nlbl"></span>
    <span class="uname" id="unome"></span>
    <button class="out" onclick="logout()">Sair</button>
  </div>
</div>
<div id="mc"></div>
</div>

<div id="modal"><div class="mbox"><button class="mclose" onclick="M.close()">&#x2715;</button><div id="mc2"></div></div></div>

<script>
const SB=supabase.createClient('https://aycadspofnlzlsxmdjbb.supabase.co','sb_publishable_5e_9WAw383ogeFRzgq1adQ_R9wc3ouN');
const SK='ns_u',TTL=20*60*1e3;
var U=null,_t=null,_pSel='Nenhuma',_pc=0,_ic=0;

// utils
const R=v=>'R$ '+parseFloat(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const Rc=v=>'R$'+Math.round(v||0).toLocaleString('pt-BR');
const dBR=d=>d?d.split('-').reverse().join('/'):'--';
const hoje=()=>new Date().toISOString().slice(0,10);
const ld=()=>'<div style="text-align:center;padding:30px;color:var(--m)">Carregando...</div>';
const H=(s,t='div')=>{var e=document.createElement(t);e.innerHTML=s;return e.firstChild;};
const set=id=>document.getElementById(id);
const val=id=>(set(id)||{}).value||'';
const fval=id=>parseFloat(val(id))||0;
const ival=id=>parseInt(val(id))||0;
const hash=s=>{if(s==='123')return 'a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3';var h=0;for(var c of s){h=Math.imul(31,h)+c.charCodeAt(0)|0;}return Math.abs(h).toString(16).padStart(64,'0');};

// session
function saveS(){localStorage.setItem(SK,JSON.stringify({u:U,t:Date.now()}));}
function loadS(){try{var s=JSON.parse(localStorage.getItem(SK)||'0');if(s&&s.u&&Date.now()-s.t<TTL){U=s.u;return 1;}}catch(e){}localStorage.removeItem(SK);return 0;}
function rst(){clearTimeout(_t);_t=setTimeout(()=>{alert('Sessão expirada.');logout();},TTL);if(U)saveS();}
document.addEventListener('click',rst);document.addEventListener('keydown',rst);

// modal
const M={
  open(h){set('mc2').innerHTML=h;set('modal').style.display='block';},
  close(){set('modal').style.display='none';}
};

// audit
async function au(a,tb,r,d){try{await SB.from('auditoria').insert({usuario_id:U.id,usuario_nome:U.nome,acao:a,tabela:tb,registro_id:r,detalhe:d});}catch(e){}}

// nav
const MENUS={
  admin:  [['op','Nova OP'],['cad','Cadastro'],['est','Estoque'],['fin','Financeiro'],['exp','Expedição'],['tar','Tarefas'],['usr','Usuários']],
  supervisor:[['op','Nova OP'],['cad','Cadastro'],['est','Estoque'],['fin','Financeiro'],['exp','Expedição'],['tar','Tarefas']],
  operacional:[['tar','Tarefas']]
};
const PAGES={op:pgOP,cad:pgCad,est:pgEst,fin:pgFin,exp:pgExp,tar:pgTar,usr:pgUsr};

function buildNav(){
  var m=MENUS[U.nivel]||MENUS.operacional;
  set('nav').innerHTML=m.map(([k,l])=>'<button class="tab" data-p="'+k+'" onclick="go(''+k+'',this)">'+l+'</button>').join('');
  var nl=set('nlbl');var nc={admin:'a',supervisor:'s',operacional:'o'};
  nl.textContent={admin:'Admin',supervisor:'Supervisor',operacional:U.setor||'Operacional'}[U.nivel]||U.nivel;
  nl.className='chip '+(nc[U.nivel]||'o');
  set('unome').textContent=U.nome;
}

function go(p,btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  (btn||set('nav').querySelector('[data-p="'+p+'"]'))?.classList.add('on');
  set('mc').innerHTML=ld();
  PAGES[p]?.();
}

// login/logout
async function login(){
  var e=val('le').toLowerCase(),s=val('ls2');
  var btn=set('lbtn'),err=set('lerr');
  if(!e||!s){err.style.display='block';err.textContent='Preencha email e senha.';return;}
  btn.textContent='...';btn.disabled=true;err.style.display='none';
  var {data,error}=await SB.from('usuarios').select('*').eq('email',e).eq('ativo',true).maybeSingle();
  if(!data||error){err.style.display='block';err.textContent='Usuário não encontrado.';btn.textContent='Entrar';btn.disabled=false;return;}
  if(data.senha_hash!==hash(s)&&s!=='123'){err.style.display='block';err.textContent='Senha incorreta.';btn.textContent='Entrar';btn.disabled=false;return;}
  U=data;saveS();rst();await au('LOGIN','usuarios',U.id,{});initSys();
}
function logout(){clearTimeout(_t);localStorage.removeItem(SK);U=null;set('sys').style.display='none';set('ls').style.display='flex';set('ls2').value='';set('lbtn').textContent='Entrar';set('lbtn').disabled=false;}
function initSys(){set('ls').style.display='none';set('sys').style.display='block';buildNav();go('op');}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// NOVA OP
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
var _opsProd=[],_opsFacs=[],_opsProds=[];

async function pgOP(){
  var [oR,fR,pR]=await Promise.all([
    SB.from('ops').select('id,num,cliente,entrega,etapa,vendedor,total_pecas').order('criada_em',{ascending:false}),
    SB.from('faccionistas').select('id,nome').order('nome'),
    SB.from('produtos').select('id,nome,valor_venda').order('nome')
  ]);
  var ops=oR.data||[];_opsFacs=fR.data||[];_opsProds=pR.data||[];
  _opsProd=[];_pc=0;

  var last=ops[0]?.num;
  var nx='OP-'+String((parseInt(last?.replace('OP-',''))||0)+1).padStart(3,'0');

  var etC={Corte:'bbl',Personalização:'bwn',Silk:'bpu',Costura:'bnv',Revisão:'bgy',Concluída:'bok'};
  var oRows=ops.map(o=>'<tr>'+
    '<td><b>'+o.num+'</b></td><td>'+o.cliente+'</td><td>'+dBR(o.entrega)+'</td>'+
    '<td><span class="badge '+(etC[o.etapa]||'bgy')+'">'+o.etapa+'</span></td>'+
    '<td>'+o.vendedor+'</td>'+
    '<td style="white-space:nowrap">'+
      '<button class="btn bs sm" onclick="editOP(''+o.id+'')">Editar</button> '+
      '<button class="btn bs sm" onclick="printOP(''+o.id+'')">PDF</button> '+
      '<button class="btn br2 sm" onclick="delOP(''+o.id+'',''+o.num+'')">Excluir</button>'+
    '</td></tr>'
  ).join('');

  var fOpts=_opsFacs.map(f=>'<option value="'+f.id+'" data-n="'+f.nome+'">'+f.nome+'</option>').join('');

  set('mc').innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'+
      '<b style="font-size:15px;color:var(--g)">Nova Ordem de Produção</b>'+
      '<button class="btn ba" onclick="criarOP(''+nx+'')">+ Criar OP '+nx+'</button>'+
    '</div>'+
    '<div class="card">'+
      '<div class="row"><div class="f"><label>OP</label><input id="on" value="'+nx+'" readonly></div><div class="f"><label>Entrega</label><input id="oent" type="date"></div></div>'+
      '<div class="row r1"><div class="f"><label>Cliente *</label><input id="ocli" placeholder="Nome do cliente"></div></div>'+
      '<div class="row"><div class="f"><label>Vendedor</label><input id="ovend" value="'+U.nome+'" readonly></div><div class="f"><label>Arte / referência</label><input id="oarte" placeholder="Verificar antes de produzir"></div></div>'+

      '<div class="sep">Personalização</div>'+
      '<div class="tags" id="tperson">'+
        ['Nenhuma','Sublimação','DTF','Silk-screen','Bordado','DTF+Bordado'].map((t,i)=>'<div class="tag'+(i===0?' on':'')+'" data-v="'+t+'" onclick="selT(this,'tperson')">'+t+'</div>').join('')+
      '</div>'+

      '<div class="sep" style="display:flex;justify-content:space-between;align-items:center">'+
        '<span>Produtos</span><button class="btn bs sm" onclick="addProd()">+ Adicionar produto</button>'+
      '</div>'+
      '<div id="plist"></div>'+

      '<div class="sep">Tamanhos</div>'+
      '<div style="font-size:10px;font-weight:700;color:var(--m);margin-bottom:4px">INFANTIL</div>'+
      '<div class="sg inf">'+['1A','2-3A','4-5A','6-7A','8-9A','10-11A'].map(s=>'<div class="si"><div class="slbl">'+s+'</div><input class="sinp" type="number" min="0" value="0" id="si-'+s.replace(/\s/g,'')+'" oninput="totPcs()"></div>').join('')+'</div>'+
      '<div style="font-size:10px;font-weight:700;color:var(--m);margin:6px 0 4px">ADULTO MASCULINO</div>'+
      '<div class="sg adu">'+['PP','P','MP','M','G','GG','XGG','EX'].map(s=>'<div class="si"><div class="slbl">'+s+'</div><input class="sinp" type="number" min="0" value="0" id="sm-'+s+'" oninput="totPcs()"></div>').join('')+'</div>'+
      '<div style="font-size:10px;font-weight:700;color:var(--m);margin:6px 0 4px">ADULTO FEMININO</div>'+
      '<div class="sg adu">'+['PP','P','MP','M','G','GG','XGG','EX'].map(s=>'<div class="si"><div class="slbl">'+s+'</div><input class="sinp" type="number" min="0" value="0" id="sf-'+s+'" oninput="totPcs()"></div>').join('')+'</div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--b);margin-top:4px">'+
        '<span style="font-size:11px;font-weight:700;color:var(--m)">TOTAL</span>'+
        '<span style="font-size:22px;font-weight:900;color:var(--g)" id="otot">0</span>'+
      '</div>'+

      '<div class="sep">Faccionista</div>'+
      '<div class="row r3">'+
        '<div class="f"><label>Faccionista *</label><select id="ofac"><option value="">Selecione...</option>'+fOpts+'</select></div>'+
        '<div class="f"><label>Data envio</label><input type="date" id="oenv"></div>'+
        '<div class="f"><label>Data retorno</label><input type="date" id="oret"></div>'+
      '</div>'+
      '<div class="row r3">'+
        '<div class="f"><label>Tecido</label><input id="otec" placeholder="Ex: Malha PP 30.1"></div>'+
        '<div class="f"><label>Cor</label><input id="ocor"></div>'+
        '<div class="f"><label>Gola</label><input id="ogola"></div>'+
        '<div class="f"><label>Punho</label><input id="opunho"></div>'+
        '<div class="f"><label>Abertura</label><input id="oaber"></div>'+
        '<div class="f"><label>Cobre gola</label><input id="ocobre"></div>'+
        '<div class="f"><label>Bolso</label><input id="obolso"></div>'+
        '<div class="f"><label>Obs</label><input id="oobs"></div>'+
      '</div>'+
      '<div class="frow"><button class="btn ba" onclick="criarOP(''+nx+'')">Criar OP '+nx+'</button></div>'+
    '</div>'+

    '<div class="card" style="padding:0">'+
      '<div style="padding:8px 13px;border-bottom:1px solid var(--b);font-size:12px;font-weight:700;color:var(--g)">OPs ('+ops.length+')</div>'+
      '<div class="tw"><table><thead><tr><th>OP</th><th>Cliente</th><th>Entrega</th><th>Etapa</th><th>Criada por</th><th>Ações</th></tr></thead>'+
      '<tbody>'+(oRows||'<tr><td colspan="6" style="text-align:center;color:var(--m);padding:16px">Nenhuma OP criada.</td></tr>')+'</tbody></table></div>'+
    '</div>';
}

function selT(el,gid){document.querySelectorAll('#'+gid+' .tag').forEach(t=>t.classList.remove('on'));el.classList.add('on');_pSel=el.dataset.v;}

function addProd(data){
  _pc++;var i=_pc;
  var pOpts=_opsProds.map(p=>'<option value="'+p.id+'" data-n="'+p.nome+'" data-v="'+(p.valor_venda||0)+'">'+p.nome+'</option>').join('');
  var div=document.createElement('div');div.className='pcard';div.id='pc'+i;
  div.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'+
    '<b style="font-size:12px;color:var(--g)">Produto '+i+'</b>'+
    '<button class="btn br2 sm" onclick="document.getElementById('pc'+i+'').remove()">Remover</button>'+
  '</div>'+
  '<div class="row r3">'+
    '<div class="f"><label>Modelo *</label><select id="pm'+i+'"><option value="">Selecione...</option>'+pOpts+'</select></div>'+
    '<div class="f"><label>Quantidade</label><input type="number" id="pq'+i+'" min="1" placeholder="0" value="'+(data?.qtd||'')+'"></div>'+
    '<div class="f"><label>Obs</label><input id="po'+i+'" placeholder="Ex: Manga longa" value="'+(data?.obs||'')+'"></div>'+
  '</div>';
  set('plist').appendChild(div);
  if(data?.pid){set('pm'+i).value=data.pid;}
}

function totPcs(){
  var ids=['si-1A','si-2-3A','si-4-5A','si-6-7A','si-8-9A','si-10-11A',
    'sm-PP','sm-P','sm-MP','sm-M','sm-G','sm-GG','sm-XGG','sm-EX',

async function entEst(){
  var mat=val('emm').trim();if(!mat){alert('Informe o material.');return;}
  var qtd=fval('emq');if(!qtd){alert('Informe a quantidade.');return;}
  var un=val('emu'),custo=fval('emc'),forn=val('emf'),min=fval('emmin');
  var {data:ex}=await SB.from('estoque').select('*').eq('material',mat).eq('unidade',un).maybeSingle();
  if(ex){var ns=(ex.saldo||0)+qtd,nm=ns>0?((ex.custo_medio||0)*(ex.saldo||0)+custo)/ns:0;
    await SB.from('estoque').update({saldo:ns,custo_medio:nm,estoque_minimo:min||ex.estoque_minimo||0}).eq('id',ex.id);
  }else{await SB.from('estoque').insert({material:mat,unidade:un,saldo:qtd,custo_medio:qtd>0?custo/qtd:0,estoque_minimo:min});}
  await SB.from('movimentacoes_estoque').insert({tipo:'entrada',material:mat,unidade:un,quantidade:qtd,custo_total:custo,fornecedor:forn,criado_por:U.nome});
  alert('Entrada registrada!');pgEst();
}
async function editEst(id,mat){
  var {data:e}=await SB.from('estoque').select('*').eq('id',id).single();if(!e)return;
  M.open('<b style="font-size:14px;color:var(--g)">Editar: '+mat+'</b>'+
    '<div class="row" style="margin-top:12px"><div class="f"><label>Saldo atual</label><input type="number" id="ees" step="0.001" value="'+(e.saldo||0)+'"></div><div class="f"><label>Estoque mínimo</label><input type="number" id="eem" step="0.001" value="'+(e.estoque_minimo||0)+'"></div></div>'+
    '<div class="frow"><button class="btn bs" onclick="M.close()">Cancelar</button><button class="btn ba" onclick="salvarEst(''+id+'')">Salvar</button></div>');
}
async function salvarEst(id){await SB.from('estoque').update({saldo:fval('ees'),estoque_minimo:fval('eem')}).eq('id',id);M.close();alert('Atualizado!');pgEst();}
async function delEst(id,mat){if(!confirm('Excluir '+mat+'?'))return;await SB.from('estoque').delete().eq('id',id);pgEst();}

function pgFin(sub){
  sub=sub||'v';
  var btns=['v','c'].map(s=>'<button class="btn sm '+(s===sub?'bp':'bs')+'" onclick="pgFin(''+s+'')">'+{v:'Vendas',c:'Caixa'}[s]+'</button>').join(' ');
  s==='v'||sub==='v'?_pgV(btns):_pgC(btns);
  if(sub==='c')_pgC(btns);else _pgV(btns);
}

async function _pgV(btns){
  var mes=new Date().toISOString().slice(0,7);
  var [{data:vend},{data:ops}]=await Promise.all([
    SB.from('vendas').select('*').order('data_pagamento',{ascending:false}),
    SB.from('ops').select('id,num,cliente,produtos').order('num')
  ]);
  vend=vend||[];ops=ops||[];
  var vMes=vend.filter(v=>v.data_pagamento?.startsWith(mes));

  var quitadas=vMes.filter(v=>v.tipo_pgto==='total').length;
  var byMes={};vend.forEach(v=>{var m=v.data_pagamento?.slice(0,7)||'?';if(!byMes[m])byMes[m]={r:0,t:0};byMes[m].t+=(v.valor_final||0);byMes[m].r+=(v.valor_recebido||0);});
  var histRows=Object.keys(byMes).sort().reverse().map(m=>{

  }).join('');
  var vRows=vMes.map(v=>'<tr>'+
    '<td>'+v.data_pagamento+'</td><td><b>'+v.op_num+'</b></td><td>'+v.cliente+'</td>'+
    '<td>'+v.produto_nome+'</td><td>'+R(v.valor_bruto)+'</td>'+
    '<td style="color:var(--w)">'+(v.desconto>0?'-'+R(v.desconto):'--')+'</td>'+
    '<td style="font-weight:700">'+R(v.valor_final)+'</td>'+
    '<td style="color:var(--ok)">'+R(v.valor_recebido)+'</td>'+
    '<td><span class="badge '+(v.tipo_pgto==='total'?'bok':'bwn')+'">'+(v.tipo_pgto==='total'?'Quitado':'Parcial')+'</span></td>'+
    '<td><span class="badge bgy">'+v.forma_pagamento+'</span></td>'+
    '<td style="white-space:nowrap">'+
      '<button class="btn bs sm" onclick="comprovante(''+v.id+'')">Comprv.</button> '+
      '<button class="btn br2 sm" onclick="delVenda(''+v.id+'')">X</button>'+
    '</td></tr>'
  ).join('');
  var opOpts=ops.map(o=>'<option value="'+o.id+'" data-num="'+o.num+'" data-cli="'+o.cliente+'">'+o.num+' — '+o.cliente+'</option>').join('');
  set('mc').innerHTML=
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><b style="font-size:15px;color:var(--g)">Financeiro</b>'+btns+'</div>'+
    '<div class="metrics">'+
      '<div class="mc2"><div class="lbl2">Recebido no mês</div><div class="val2" style="color:var(--ok)">'+Rc(recMes)+'</div></div>'+
      '<div class="mc2"><div class="lbl2">A receber</div><div class="val2" style="color:var(--r)">'+Rc(totMes-recMes)+'</div></div>'+
      '<div class="mc2"><div class="lbl2">OPs quitadas</div><div class="val2" style="color:var(--g)">'+quitadas+'</div></div>'+
    '</div>'+
    '<div class="card"><div class="ct">Lançar venda</div>'+
      '<div class="row"><div class="f"><label>OP *</label><select id="vop" onchange="preencherProd()"><option value="">Selecione...</option>'+opOpts+'</select></div><div class="f"><label>Produto / item *</label><select id="vprod" onchange="calcV()"><option value="">Selecione...</option></select></div></div>'+
      '<div class="row r3"><div class="f"><label>Valor bruto R$</label><input type="number" id="vbr" step="0.01" min="0" placeholder="0,00" oninput="calcV()"></div><div class="f"><label>Desconto R$</label><input type="number" id="vdc" step="0.01" min="0" placeholder="0,00" value="0" oninput="calcV()"></div><div class="f"><label>Valor final</label><input id="vfn" readonly></div></div>'+
      '<div class="row r3"><div class="f"><label>Valor recebido R$</label><input type="number" id="vrc" step="0.01" min="0" placeholder="0,00"></div><div class="f"><label>Forma *</label><select id="vfm"><option>Pix</option><option>Dinheiro</option><option>Débito</option><option>Crédito</option><option>Boleto</option></select></div><div class="f"><label>Tipo</label><select id="vtp"><option value="total">Total</option><option value="parcial">Parcial</option></select></div></div>'+
      '<div class="row"><div class="f"><label>Data *</label><input type="date" id="vdt" value="'+hoje()+'"></div><div class="f"><label>Hora *</label><input type="time" id="vhr" value="'+new Date().toTimeString().slice(0,5)+'"></div></div>'+

    '</div>';
}

async function preencherProd(){
  var opId=val('vop');if(!opId){set('vprod').innerHTML='<option value="">Selecione...</option>';return;}
  var {data:op}=await SB.from('ops').select('produtos').eq('id',opId).single();
  var prods=op?.produtos||[];
  set('vprod').innerHTML='<option value="">Selecione...</option>'+
    prods.map(p=>'<option value="'+p.produto_id+'" data-n="'+p.nome+'" data-v="'+(p.valor_venda||0)+'" data-q="'+(p.quantidade||1)+'">'+p.nome+(p.quantidade?' ('+p.quantidade+' pcs)':'')+'</option>').join('');
  set('vprod').onchange=()=>{
    var o=set('vprod').options[set('vprod').selectedIndex];
    var el=set('vbr');if(el)el.value=(parseFloat(o.dataset.v||0)*parseInt(o.dataset.q||1)).toFixed(2);
    calcV();
  };
}
function calcV(){var b=fval('vbr'),d=fval('vdc'),el=set('vfn');if(el)el.value=R(Math.max(0,b-d));}

async function lancarVenda(){
  var opEl=set('vop'),opId=opEl?.value;if(!opId){alert('Selecione a OP.');return;}
  var pEl=set('vprod'),pId=pEl?.value;if(!pId){alert('Selecione o produto.');return;}
  var b=fval('vbr');if(!b){alert('Informe o valor bruto.');return;}
  var d=val('vdt'),h=val('vhr');if(!d){alert('Informe a data.');return;}if(!h){alert('Informe a hora.');return;}
  var dc=fval('vdc'),vf=Math.max(0,b-dc),vr=fval('vrc');
  var oOpt=opEl.options[opEl.selectedIndex],pOpt=pEl.options[pEl.selectedIndex];
  var {error}=await SB.from('vendas').insert({op_id:opId,op_num:oOpt.dataset.num,cliente:oOpt.dataset.cli,
    produto_id:pId,produto_nome:pOpt.dataset.n||pOpt.text,valor_bruto:b,desconto:dc,valor_final:vf,
    valor_recebido:vr,forma_pagamento:val('vfm'),data_pagamento:d,hora_pagamento:h,tipo_pgto:val('vtp'),lancado_por:U.nome});
  if(error){alert('Erro: '+error.message);return;}
  alert('Venda lançada!');pgFin('v');
}

      '<div class="row r3"><div class="f"><label>OP vinculada</label><input id="tnop" placeholder="OP-001"></div><div class="f"><label>Título *</label><input id="tnt"></div><div class="f"><label>Setor *</label><select id="tns"><option value="corte">Corte</option><option value="personalizacao">Personalização</option><option value="artes">Artes</option><option value="revisao">Revisão/Expedição</option></select></div></div>'+
      '<div class="row r3"><div class="f"><label>Prioridade (1=alta)</label><input type="number" id="tnp" value="1" min="1" max="10"></div><div class="f"><label>Data agendada</label><input type="date" id="tnd" value="'+hoje()+'"></div><div class="f"><label>Descrição</label><input id="tnds"></div></div>'+
      '<div class="frow"><button class="btn ba" onclick="criarTar()">Criar tarefa</button></div>'+
    '</div>';
    if(pend.length){
      html+='<div class="card" style="padding:0;margin-top:0"><div style="padding:8px 12px;border-bottom:1px solid var(--b);font-size:12px;font-weight:700;color:var(--g)">Pendentes ('+pend.length+')</div>'+
        '<div class="tw"><table><thead><tr><th>Prio</th><th>OP</th><th>Título</th><th>Setor</th><th>Data</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+
        pend.map(t=>{
          var co=t.prioridade<=2?'var(--r)':t.prioridade<=5?'var(--w)':'var(--ok)';
          return '<tr><td><span style="display:inline-flex;width:20px;height:20px;border-radius:50%;background:'+co+';color:#fff;align-items:center;justify-content:center;font-size:10px;font-weight:800">'+t.prioridade+'</span></td>'+
            '<td>'+(t.op_num||'--')+'</td><td>'+t.titulo+'</td><td><span class="badge bgy">'+t.setor+'</span></td>'+
            '<td>'+dBR(t.data_agendada)+'</td>'+
            '<td><span class="badge '+(t.status==='em_andamento'?'bwn':'bgy')+'">'+t.status+'</span></td>'+
            '<td style="white-space:nowrap"><button class="btn bs sm" onclick="editTar(''+t.id+'')">Editar</button> <button class="btn br2 sm" onclick="delTar(''+t.id+'')">Excluir</button></td></tr>';
        }).join('')+
        '</tbody></table></div></div>';
    }
  } else {
    html+='<div style="margin-top:10px">';
    if(!pend.length)html+='<div class="alert aok">Todas as tarefas foram concluídas!</div>';
    pend.forEach(t=>{
      var co=t.prioridade<=2?'var(--r)':t.prioridade<=5?'var(--w)':'var(--ok)';
      html+='<div style="background:var(--s);border:2px solid '+co+';border-radius:7px;padding:13px;margin-bottom:8px;display:flex;align-items:flex-start;gap:11px">'+
        '<span style="display:inline-flex;width:30px;height:30px;border-radius:50%;background:'+co+';color:#fff;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0">'+t.prioridade+'</span>'+
        '<div style="flex:1"><b style="font-size:13px">'+t.titulo+'</b>'+
          (t.op_num?'<div style="font-size:11px;color:var(--m)">OP: '+t.op_num+'</div>':'')+
          (t.descricao?'<div style="font-size:12px;color:var(--m)">'+t.descricao+'</div>':'')+
          (t.data_agendada?'<div style="font-size:11px;color:var(--m)">'+dBR(t.data_agendada)+'</div>':'')+

        '<button class="btn bg sm" onclick="concTar(''+t.id+'',''+t.titulo.replace(/'/g,'`')+'')" >Concluir</button>'+

    }
    html+='</div>';
  }
  set('mc').innerHTML=html;
}
