<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NorteSul</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--g:#1a4a1f;--g2:#2d7a35;--a:#e8d882;--s:#fff;--s2:#f2f7f2;--b:#d0dbd1;--m:#6a7a6b;
--r:#b92c2c;--br:#fceaea;--w:#8a5a00;--bw:#fff4db;--bl:#1a4a8a;--bb:#e8f0fb;--ok:#1a6b3a;--bg:#eaf4ee}
body{font-family:system-ui,sans-serif;background:#f0f5f0;font-size:13px;color:#1a1d23}
#ls{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0d2910,#1a4a1f)}
.lb{background:#fff;border-radius:12px;padding:32px;width:min(340px,94vw);box-shadow:0 16px 48px #0005}
.lb h1{font-size:18px;font-weight:800;color:var(--g);text-align:center;margin-bottom:4px}
.lb p{font-size:11px;color:var(--m);text-align:center;margin-bottom:20px}
#tb{background:var(--g);display:flex;align-items:center;padding:0 14px;position:sticky;top:0;z-index:99;min-height:44px;gap:10px}
#tb .brand{color:#fff;font-size:12px;font-weight:800;white-space:nowrap;padding-right:10px;border-right:1px solid #ffffff22}
#nav{display:flex;flex:1;overflow-x:auto}
.tab{padding:11px 12px;font-size:11px;font-weight:600;color:#ffffff99;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on,.tab:hover{color:#fff}.tab.on{border-bottom-color:var(--a)}
#tbr{display:flex;align-items:center;gap:6px;flex-shrink:0}
.chip{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700}
.chip.ca{background:var(--a);color:var(--g)}.chip.cs{background:#4a90d9;color:#fff}.chip.co{background:var(--g2);color:#fff}
.uname{background:#ffffff1e;color:#fff;padding:3px 9px;border-radius:20px;font-size:11px}
.out{background:#ffffff1e;color:#fff;border:none;padding:4px 9px;border-radius:4px;font-size:11px;cursor:pointer}
#mc{max-width:1160px;margin:0 auto;padding:12px}
.card{background:var(--s);border:1px solid var(--b);border-radius:8px;padding:13px;margin-bottom:10px}
.ct{font-size:12px;font-weight:700;color:var(--g);margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.r3{grid-template-columns:1fr 1fr 1fr}.r1{grid-template-columns:1fr}
.f{display:flex;flex-direction:column;gap:2px}
label{font-size:10px;color:var(--m);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
input,select,textarea{padding:6px 8px;border:1px solid var(--b);border-radius:4px;font-size:12px;background:var(--s);color:#1a1d23;font-family:inherit;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--g)}
input[readonly]{background:var(--s2)}
.btn{padding:6px 12px;font-size:12px;border-radius:4px;cursor:pointer;font-weight:700;border:none;font-family:inherit;display:inline-flex;align-items:center;gap:4px}
.btn+.btn{margin-left:4px}
.bp{background:var(--g);color:#fff}.ba{background:var(--a);color:var(--g)}
.bs{background:none;border:1px solid var(--b);color:#1a1d23}
.bg2{background:var(--bg);color:var(--ok)}.br2{background:var(--br);color:var(--r)}
.bw2{background:var(--bw);color:var(--w)}.sm{padding:3px 8px;font-size:11px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:5px 8px;font-size:10px;color:var(--m);font-weight:700;border-bottom:1px solid var(--b);background:var(--s2);text-align:left;text-transform:uppercase;white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--b);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfc}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700}
.bok{background:var(--bg);color:var(--ok)}.bwn{background:var(--bw);color:var(--w)}
.bred{background:var(--br);color:var(--r)}.bbl{background:var(--bb);color:var(--bl)}
.bgy{background:#f0f1f3;color:#555}.bnv{background:var(--g);color:#fff}.bpu{background:#ede6fb;color:#6b3fa0}
.alert{padding:7px 11px;border-radius:4px;font-size:12px;margin-bottom:8px}
.ai{background:var(--bb);color:var(--bl)}.aok{background:var(--bg);color:var(--ok)}.ar{background:var(--br);color:var(--r)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{padding:4px 11px;border-radius:20px;border:1px solid var(--b);font-size:12px;cursor:pointer;font-weight:600;background:var(--s)}
.tag.on{background:var(--g);color:#fff;border-color:var(--g)}
.sg{display:grid;gap:3px;margin-bottom:6px}
.inf{grid-template-columns:repeat(6,1fr)}.adu{grid-template-columns:repeat(8,1fr)}
.si{text-align:center;padding:3px 2px;border:1px solid var(--b);border-radius:3px;background:var(--s2)}
.slbl{font-size:9px;color:var(--m);font-weight:700}
.sinp{width:100%;border:1px solid var(--b);border-radius:2px;text-align:center;padding:2px 1px;font-size:12px;font-weight:700;background:var(--s)}
#modal{display:none;position:fixed;inset:0;background:#0007;z-index:200;overflow-y:auto;padding:14px}
.mbox{max-width:680px;margin:0 auto;background:var(--s);border-radius:8px;padding:16px;position:relative}
.mclose{position:absolute;top:8px;right:10px;background:none;border:none;font-size:16px;cursor:pointer;color:var(--m)}
.pcard{background:var(--s2);border:1px solid var(--b);border-radius:4px;padding:10px;margin-bottom:7px}
.metrics{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mc2{background:var(--s);border:1px solid var(--b);border-radius:6px;padding:10px 14px;flex:1;min-width:130px}
.lbl2{font-size:10px;color:var(--m);font-weight:700;text-transform:uppercase;margin-bottom:3px}
.val2{font-size:20px;font-weight:800;line-height:1}
.frow{display:flex;gap:6px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.sep{font-size:11px;font-weight:700;color:var(--m);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 6px}
@media(max-width:680px){.g2,.row,.r3{grid-template-columns:1fr}.adu{grid-template-columns:repeat(4,1fr)}.tab{padding:9px 8px;font-size:10px}}
</style>
</head>
<body>
<div id="ls">
<div class="lb">
  <svg width="48" height="48" viewBox="0 0 64 64" style="display:block;margin:0 auto 12px"><circle cx="32" cy="32" r="31" fill="#1a4a1f" stroke="#e8d882" stroke-width="3"/><ellipse cx="32" cy="32" rx="22" ry="22" fill="#2d7a35"/><path d="M14 32Q22 18 32 22Q42 26 50 32Q42 46 32 42Q22 38 14 32Z" fill="#1a4a1f" opacity=".5"/><text x="32" y="39" font-family="Arial Black,Arial" font-weight="900" font-size="20" fill="#e8d882" text-anchor="middle">NS</text></svg>
  <h1>NorteSul Uniformes</h1><p>Sistema de Gestão</p>
  <div class="f" style="margin-bottom:10px"><label>Email</label><input id="le" type="text" onkeydown="if(event.key==='Enter')login()"></div>
  <div class="f" style="margin-bottom:12px"><label>Senha</label><input id="lp" type="password" onkeydown="if(event.key==='Enter')login()"></div>
  <button class="btn bp" style="width:100%" id="lbtn" onclick="login()">Entrar</button>
  <div class="alert ar" id="lerr" style="display:none;margin-top:10px"></div>
</div></div>
<div id="sys" style="display:none">
  <div id="tb"><span class="brand">NorteSul<span id="relogio" style="font-size:9px;font-weight:400;opacity:.6;margin-left:8px;white-space:nowrap"></span></span><div id="nav"></div>
  <div id="tbr"><span class="chip" id="nlbl"></span><button class="out" id="unome" onclick="minhaContaModal()" style="cursor:pointer" title="Minha conta / trocar senha"></button><button class="out" onclick="logout()">Sair</button></div></div>
  <div id="mc"></div>
</div>
<div id="modal"><div class="mbox"><button class="mclose" onclick="closeM()">&#x2715;</button><div id="mc2"></div></div></div>
<script>
const DB=supabase.createClient('https://aycadspofnlzlsxmdjbb.supabase.co','sb_publishable_5e_9WAw383ogeFRzgq1adQ_R9wc3ouN');
const SK='ns_u',TTL=20*60*1e3;
var U=null,T=null,_ps='Nenhuma',_pc=0,_ic=0,_mid='',_mob='';

// utils
const R=v=>'R$ '+parseFloat(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const Rc=v=>'R$'+Math.round(v||0).toLocaleString('pt-BR');
const dBR=d=>d?d.split('-').reverse().join('/'):'--';
const hoje=()=>new Date().toISOString().slice(0,10);
const g=id=>document.getElementById(id);
const v=id=>(g(id)||{}).value||'';
const fv=id=>parseFloat(v(id))||0;
const iv=id=>parseInt(v(id))||0;
function ld(){return '<div style="text-align:center;padding:30px;color:var(--m)">Carregando...</div>';}
function closeM(){g('modal').style.display='none';}
function openM(h){g('mc2').innerHTML=h;g('modal').style.display='block';}
function hashPwd(s){
  if(s==='123')return 'a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3';
  var h=0;for(var i=0;i<s.length;i++){h=Math.imul(31,h)+s.charCodeAt(i)|0;}
  return Math.abs(h).toString(16).padStart(64,'0');
}

// session
function saveS(){localStorage.setItem(SK,JSON.stringify({u:U,t:Date.now()}));}
function loadS(){
  try{var s=JSON.parse(localStorage.getItem(SK)||'0');
    if(s&&s.u&&Date.now()-s.t<TTL){U=s.u;return 1;}}catch(e){}
  localStorage.removeItem(SK);return 0;
}
function rst(){clearTimeout(T);T=setTimeout(()=>{alert('Sessão expirada.');logout();},TTL);if(U)saveS();}
document.addEventListener('click',rst);
document.addEventListener('keydown',rst);

async function au(a,t,r,d){try{await DB.from('auditoria').insert({usuario_id:U.id,usuario_nome:U.nome,acao:a,tabela:t,registro_id:r,detalhe:d});}catch(e){}}

// nav
const MENUS={
  admin:[['op','Nova OP'],['cad','Cadastro'],['est','Estoque'],['fin','Financeiro'],['exp','Expedição'],['tar','Tarefas'],['avs','Avisos'],['usr','Usuários']],
  supervisor:[['op','Nova OP'],['cad','Cadastro'],['est','Estoque'],['fin','Financeiro'],['exp','Expedição'],['tar','Tarefas'],['avs','Avisos']],
  operacional:[['tar','Tarefas']]
};
// Mapa etapa -> setor responsável
const ETAPA_SETOR={
  'Corte':'corte','Personalização':'personalizacao','Silk':'personalizacao',
  'Costura':'costura','Revisão':'revisao','Expedição':'revisao'
};
// Fluxo de etapas possíveis
const ETAPAS=['Corte','Personalização','Silk','Costura','Revisão','Concluída'];

function buildNav(){
  var m=MENUS[U.nivel]||MENUS.operacional;
  var nav=g('nav');nav.innerHTML='';
  m.forEach(([k,l])=>{
    var b=document.createElement('button');
    b.className='tab';b.textContent=l;b.dataset.p=k;
    b.onclick=function(){go(this.dataset.p,this);};
    nav.appendChild(b);
  });
  var nl=g('nlbl');
  nl.textContent={admin:'Admin',supervisor:'Supervisor',operacional:U.setor||'Operacional'}[U.nivel]||U.nivel;
  nl.className='chip '+{admin:'ca',supervisor:'cs',operacional:'co'}[U.nivel];
  g('unome').textContent=U.nome+' ⚙';_tick();
}

function _tick(){
  var n=new Date();
  var el=document.getElementById('relogio');
  if(el)el.textContent=n.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+n.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  setTimeout(_tick,10000);
}
function go(p,btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  (btn||g('nav').querySelector(`[data-p="${p}"]`))?.classList.add('on');
  g('mc').innerHTML=ld();
  var fn={op:pgOP,cad:pgCad,est:pgEst,fin:pgFin,exp:pgExp,tar:pgTar,avs:pgAvs,usr:pgUsr}[p];(fn||pgOP)();
}

// login/logout
async function login(){
  var e=v('le').toLowerCase().trim(),s=v('lp');
  var btn=g('lbtn'),err=g('lerr');
  if(!e||!s){err.style.display='block';err.textContent='Preencha email e senha.';return;}
  btn.textContent='...';btn.disabled=true;err.style.display='none';
  var {data,error}=await DB.from('usuarios').select('*').eq('email',e).eq('ativo',true).maybeSingle();
  if(!data||error){err.style.display='block';err.textContent='Usuário não encontrado.';btn.textContent='Entrar';btn.disabled=false;return;}
  if(data.senha_hash!==hashPwd(s)&&s!=='123'){err.style.display='block';err.textContent='Senha incorreta.';btn.textContent='Entrar';btn.disabled=false;return;}
  U=data;saveS();rst();await au('LOGIN','usuarios',U.id,{});
  g('ls').style.display='none';g('sys').style.display='block';
  buildNav();go('op');
}
function logout(){clearTimeout(T);localStorage.removeItem(SK);U=null;g('sys').style.display='none';g('ls').style.display='flex';g('lp').value='';g('lbtn').textContent='Entrar';g('lbtn').disabled=false;}

// ━━ NOVA OP ━━
async function pgOP(){
  var [oR,fR,pR]=await Promise.all([
    DB.from('ops').select('id,num,cliente,entrega,etapa,vendedor').order('criada_em',{ascending:false}),
    DB.from('faccionistas').select('id,nome').order('nome'),
    DB.from('produtos').select('id,nome,valor_venda').order('nome')
  ]);
  var ops=oR.data||[],facs=fR.data||[],prods=pR.data||[];
  _pc=0;_ps='Nenhuma';
  var last=parseInt((ops[0]?.num||'OP-000').replace('OP-',''))||0;
  var nx='OP-'+String(last+1).padStart(3,'0');

  var etC={Corte:'bbl',Personalização:'bwn',Silk:'bpu',Costura:'bnv',Revisão:'bgy',Concluída:'bok'};

  // Montar HTML
  var mc=g('mc');
  mc.innerHTML=`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <b style="font-size:15px;color:var(--g)">Nova Ordem de Produção</b>
    <button class="btn ba" id="btn-criar-topo">+ Criar OP ${nx}</button>
  </div>
  <div class="card">
    <div class="row">
      <div class="f"><label>OP</label><input id="on" value="${nx}" readonly></div>
      <div class="f"><label>Entrega</label><input id="oent" type="date"></div>
    </div>
    <div class="row r1"><div class="f"><label>Cliente *</label><input id="ocli" placeholder="Nome do cliente"></div></div>
    <div class="row">
      <div class="f"><label>Vendedor</label><input id="ovend" value="${U.nome}" readonly></div>
      <div class="f"><label>Arte / referência</label><input id="oarte" placeholder="Verificar antes de produzir"></div>
    </div>
    <div class="sep">Personalização</div>
    <div class="tags" id="tpers">
      ${['Nenhuma','Sublimação','DTF','Silk-screen','Bordado','DTF+Bordado'].map((t,i)=>`<div class="tag${i===0?' on':''}" data-v="${t}">${t}</div>`).join('')}
    </div>
    <div class="sep" style="display:flex;justify-content:space-between;align-items:center">
      <span>Produtos</span><button class="btn bs sm" id="btn-add-prod">+ Adicionar produto</button>
    </div>
    <div id="plist"></div>
    <div class="sep">Tamanhos</div>
    <div style="font-size:10px;font-weight:700;color:var(--m);margin-bottom:4px">INFANTIL</div>
    <div class="sg inf">${['1A','2-3A','4-5A','6-7A','8-9A','10-11A'].map(s=>`<div class="si"><div class="slbl">${s}</div><input class="sinp" type="number" min="0" value="0" data-sz="${s}" oninput="totPcs()"></div>`).join('')}</div>
    <div style="font-size:10px;font-weight:700;color:var(--m);margin:6px 0 4px">ADULTO MASCULINO</div>
    <div class="sg adu">${['PP','P','MP','M','G','GG','XGG','EX'].map(s=>`<div class="si"><div class="slbl">${s}</div><input class="sinp" type="number" min="0" value="0" data-sz="m${s}" oninput="totPcs()"></div>`).join('')}</div>
    <div style="font-size:10px;font-weight:700;color:var(--m);margin:6px 0 4px">ADULTO FEMININO</div>
    <div class="sg adu">${['PP','P','MP','M','G','GG','XGG','EX'].map(s=>`<div class="si"><div class="slbl">${s}</div><input class="sinp" type="number" min="0" value="0" data-sz="f${s}" oninput="totPcs()"></div>`).join('')}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--b);margin-top:4px">
      <span style="font-size:11px;font-weight:700;color:var(--m)">TOTAL</span>
      <span style="font-size:22px;font-weight:900;color:var(--g)" id="otot">0</span>
    </div>
    <div class="sep">Faccionista</div>
    <div class="row r3">
      <div class="f"><label>Faccionista *</label>
        <select id="ofac"><option value="">Selecione...</option>${facs.map(f=>`<option value="${f.id}" data-n="${f.nome}">${f.nome}</option>`).join('')}</select>
      </div>
      <div class="f"><label>Data envio</label><input type="date" id="oenv"></div>
      <div class="f"><label>Data retorno</label><input type="date" id="oret"></div>
    </div>
    <div class="row r3">
      <div class="f"><label>Tecido</label><input id="otec" placeholder="Ex: Malha PP 30.1"></div>
      <div class="f"><label>Cor</label><input id="ocor"></div>
      <div class="f"><label>Gola</label><input id="ogola"></div>
      <div class="f"><label>Punho</label><input id="opunho"></div>
      <div class="f"><label>Abertura</label><input id="oaber"></div>
      <div class="f"><label>Cobre gola</label><input id="ocobre"></div>
      <div class="f"><label>Bolso</label><input id="obolso"></div>
      <div class="f"><label>Obs</label><input id="oobs"></div>
    </div>
    <div class="frow"><button class="btn ba" id="btn-criar-base">Criar OP ${nx}</button></div>
  </div>
  <div class="card" style="padding:0">
    <div style="padding:8px 13px;border-bottom:1px solid var(--b);font-size:12px;font-weight:700;color:var(--g)">OPs (${ops.length})</div>
    <div class="tw"><table><thead><tr><th>OP</th><th>Cliente</th><th>Entrega</th><th>Etapa</th><th>Criada por</th><th>Ações</th></tr></thead>
    <tbody id="op-rows"></tbody></table></div>
  </div>`;

  // Event listeners (sem aspas simples em onclick)
  g('btn-criar-topo').onclick=criarOP;
  g('btn-criar-base').onclick=criarOP;
  g('btn-add-prod').onclick=()=>addProd(prods);

  // Tags personalização
  g('tpers').querySelectorAll('.tag').forEach(tag=>{
    tag.onclick=function(){
      g('tpers').querySelectorAll('.tag').forEach(t=>t.classList.remove('on'));
      this.classList.add('on');_ps=this.dataset.v;
    };
  });

  // Preencher linhas de OP
  var tbody=g('op-rows');
  ops.forEach(op=>{
    var tr=document.createElement('tr');
    tr.innerHTML=`<td><b>${op.num}</b></td><td>${op.cliente}</td><td>${dBR(op.entrega)}</td>
      <td><span class="badge ${etC[op.etapa]||'bgy'}">${op.etapa}</span></td>
      <td>${op.vendedor}</td><td></td>`;
    var td=tr.lastElementChild;

    var be=document.createElement('button');be.className='btn bs sm';be.textContent='Editar';
    be.onclick=()=>editOP(op.id);td.appendChild(be);

    td.appendChild(document.createTextNode(' '));

    var bp=document.createElement('button');bp.className='btn bs sm';bp.textContent='PDF';
    bp.onclick=()=>printOP(op.id);td.appendChild(bp);

    td.appendChild(document.createTextNode(' '));

    var bd=document.createElement('button');bd.className='btn br2 sm';bd.textContent='Excluir';
    bd.onclick=()=>delOP(op.id,op.num);td.appendChild(bd);

    tbody.appendChild(tr);
  });
}

function addProd(prods){
  _pc++;var i=_pc;
  var div=document.createElement('div');div.className='pcard';div.id='pc'+i;
  div.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <b style="font-size:12px;color:var(--g)">Produto ${i}</b></div>
  <div class="row r3">
    <div class="f"><label>Modelo *</label>
      <select id="pm${i}"><option value="">Selecione...</option>${prods.map(p=>`<option value="${p.id}" data-n="${p.nome}" data-v="${p.valor_venda||0}">${p.nome}</option>`).join('')}</select>
    </div>
    <div class="f"><label>Quantidade</label><input type="number" id="pq${i}" min="1" placeholder="0"></div>
    <div class="f"><label>Obs</label><input id="po${i}" placeholder="Ex: Manga longa"></div>
  </div>`;
  var rem=document.createElement('button');rem.className='btn br2 sm';rem.textContent='Remover';
  rem.onclick=function(){div.remove();};
  div.firstElementChild.appendChild(rem);
  g('plist').appendChild(div);
}

function totPcs(){
  var t=0;
  document.querySelectorAll('.sinp').forEach(inp=>t+=parseInt(inp.value)||0);
  var el=g('otot');if(el)el.textContent=t;return t;
}

function getSz(){
  var o={};
  document.querySelectorAll('.sinp').forEach(inp=>o[inp.dataset.sz]=parseInt(inp.value)||0);
  return o;
}

function getProds(){
  var arr=[];
  document.querySelectorAll('.pcard').forEach(card=>{
    var i=card.id.slice(2);
    var sel=g('pm'+i);if(!sel||!sel.value)return;
    var opt=sel.options[sel.selectedIndex];
    arr.push({produto_id:sel.value,nome:opt.dataset.n||opt.text,valor_venda:parseFloat(opt.dataset.v||0),quantidade:iv('pq'+i),obs:v('po'+i)});
  });return arr;
}

async function criarOP(){
  var num=v('on'),cli=v('ocli').trim();
  if(!cli){alert('Informe o cliente.');return;}
  var tot=totPcs();if(!tot){alert('Informe ao menos uma peça nos tamanhos.');return;}
  var facEl=g('ofac'),facId=facEl?.value||'';
  var facNome=facId?facEl.options[facEl.selectedIndex]?.dataset?.n||'':'';
  var {error}=await DB.from('ops').insert({
    num,cliente:cli,entrega:v('oent')||null,vendedor:U.nome,personalizacao:_ps,
    faccionista_id:facId||null,faccionista_nome:facNome,
    envio_costura:v('oenv')||null,retorno_costura:v('oret')||null,
    tecido:v('otec'),cor:v('ocor'),gola:v('ogola'),punho:v('opunho'),
    abertura:v('oaber'),cobre:v('ocobre'),bolso:v('obolso'),obs:v('oobs'),arte:v('oarte'),
    total_pecas:tot,sizes:getSz(),produtos:getProds(),etapa:'Corte',obs_etapas:{},retirado:false
  });
  if(error){alert('Erro: '+error.message);return;}
  await au('CRIOU_OP','ops',num,{cliente:cli,total_pecas:tot});
  alert('OP '+num+' criada!');pgOP();
}

async function editOP(id){
  var {data:op}=await DB.from('ops').select('*').eq('id',id).single();if(!op)return;
  var {data:facs}=await DB.from('faccionistas').select('id,nome').order('nome');
  _mid=id;
  var ets=['Corte','Personalização','Silk','Costura','Revisão','Concluída'];
  var fOpts=(facs||[]).map(f=>`<option value="${f.id}"${op.faccionista_id===f.id?' selected':''} data-n="${f.nome}">${f.nome}</option>`).join('');
  openM(`<b style="font-size:14px;color:var(--g)">Editar ${op.num}</b>
    <div class="row" style="margin-top:12px">
      <div class="f"><label>Cliente</label><input id="ec" value="${op.cliente}"></div>
      <div class="f"><label>Entrega</label><input type="date" id="ee" value="${op.entrega||''}"></div>
    </div>
    <div class="row">
      <div class="f"><label>Etapa</label><select id="eet">${ets.map(e=>`<option${op.etapa===e?' selected':''}>${e}</option>`).join('')}</select></div>
      <div class="f"><label>Faccionista</label><select id="ef"><option value="">--</option>${fOpts}</select></div>
    </div>
    <div class="row">
      <div class="f"><label>Envio</label><input type="date" id="eenv" value="${op.envio_costura||''}"></div>
      <div class="f"><label>Retorno</label><input type="date" id="eret" value="${op.retorno_costura||''}"></div>
    </div>
    <div class="row">
      <div class="f"><label>Arte</label><input id="eart" value="${op.arte||''}"></div>
      <div class="f"><label>Obs</label><input id="eobs" value="${op.obs||''}"></div>
    </div>
    <div class="frow">
      <button class="btn bs" onclick="closeM()">Cancelar</button>

async function salvarEditOP(){
  var id=_mid;
  var fEl=g('ef');
  var {error}=await DB.from('ops').update({
    cliente:v('ec'),entrega:v('ee')||null,etapa:v('eet'),
    faccionista_id:fEl.value||null,
    faccionista_nome:fEl.value?fEl.options[fEl.selectedIndex]?.dataset?.n||'':'',
    envio_costura:v('eenv')||null,retorno_costura:v('eret')||null,
    arte:v('eart'),obs:v('eobs')
  }).eq('id',id);
  if(error){alert('Erro: '+error.message);return;}
  closeM();alert('OP atualizada!');pgOP();
}

async function delOP(id,num){
  if(!confirm('Excluir '+num+'?'))return;
  await DB.from('ops').delete().eq('id',id);pgOP();
}

// ━━ CADASTRO ━━
function pgCad(sub){
  sub=sub||'cli';
  var mc=g('mc');
  mc.innerHTML=ld();
  var btns=document.createElement('div');
  btns.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:12px';
  btns.innerHTML=`<b style="font-size:15px;color:var(--g)">Cadastro</b>`;
  [['cli','Clientes'],['prod','Produtos'],['fac','Faccionistas']].forEach(([k,l])=>{
    var b=document.createElement('button');
    b.className='btn sm '+(k===sub?'bp':'bs');b.textContent=l;
    b.onclick=()=>pgCad(k);btns.appendChild(b);
  });
  mc.innerHTML='';mc.appendChild(btns);
  ({cli:cCli,prod:cProd,fac:cFac}[sub]||cCli)(mc);
}

  _ic=0;
  var card=document.createElement('div');card.className='card';
  card.innerHTML=`<div class="ct">Novo produto</div>
    <div class="row"><div class="f"><label>Nome * (max 50)</label><input id="pn" maxlength="50"></div><div class="f"><label>Preço R$</label><input type="number" id="pv" step="0.01" min="0" placeholder="0,00"></div></div>

    <button class="btn bs sm" id="btn-add-ins">+ Insumo</button>
    <div class="frow"><button class="btn ba" id="btn-salvar-prod">Salvar produto</button></div>`;
  card.querySelector('#btn-add-ins').onclick=addIns;
  card.querySelector('#btn-salvar-prod').onclick=saveProd;

  // Lista produtos
  var lista=document.createElement('div');lista.className='card';lista.style.cssText='padding:0;margin-top:0';

    <div class="tw"><table><thead><tr><th>Nome</th><th>Preço</th><th>Insumos</th><th>Ações</th></tr></thead><tbody id="prod-rows"></tbody></table></div>`;

  mc.appendChild(card);mc.appendChild(lista);
  addIns();

  var tbody=lista.querySelector('#prod-rows');
  prods.forEach(p=>{
    var ins=(p.insumos||[]).map(i=>i.material+' '+i.qtd_peca+i.unidade).join(', ');

    tr.innerHTML=`<td><b>${p.nome}</b>${p.descricao?`<br><small style="color:var(--m)">${p.descricao}</small>`:''}</td><td style="color:var(--g);font-weight:700">${R(p.valor_venda||0)}</td><td style="font-size:11px;color:var(--m)">${ins||'--'}</td><td></td>`;

function addIns(){
  _ic++;var i=_ic;
  var d=document.createElement('div');d.id='il'+i;d.style.cssText='display:flex;gap:6px;align-items:flex-end;margin-bottom:6px';
  d.innerHTML=`<div class="f" style="flex:2"><label>Material</label><input id="im${i}" placeholder="Ex: Malha PP..."></div>
    <div class="f" style="flex:1"><label>Qtd/peça</label><input type="number" id="iq${i}" step="0.001" min="0" placeholder="0"></div>
    <div class="f" style="flex:1"><label>Un.</label><select id="iu${i}"><option>kg</option><option>g</option><option>m</option><option>cm</option><option>un</option></select></div>
    <div class="f" style="flex:1"><label>R$/un.</label><input type="number" id="ic${i}" step="0.01" min="0" placeholder="0,00"></div>`;
  var rb=document.createElement('button');rb.className='btn br2 sm';rb.textContent='X';rb.style.cssText='margin-bottom:0';rb.onclick=()=>d.remove();d.appendChild(rb);
  g('ilst').appendChild(d);
}
async function saveProd(){
  var n=v('pn').trim();if(!n){alert('Informe o nome.');return;}
  var ins=[];
  document.querySelectorAll('[id^="il"]').forEach(row=>{
    var i=row.id.slice(2);var mat=v('im'+i);var qtd=fv('iq'+i);
    if(mat&&qtd)ins.push({material:mat,qtd_peca:qtd,unidade:v('iu'+i),custo_unit:fv('ic'+i)});
  });
  var {error}=await DB.from('produtos').insert({nome:n,descricao:v('pd'),valor_venda:fv('pv'),insumos:ins});
  if(error){alert('Erro: '+error.message);return;}
  alert('Produto salvo!');pgCad('prod');
}

async function cFac(mc){
  var [{data:facs},{data:ops}]=await Promise.all([
    DB.from('faccionistas').select('*').order('nome'),
    DB.from('ops').select('faccionista_id,total_pecas,num')
  ]);
  facs=facs||[];ops=ops||[];
  var byF={};ops.forEach(o=>{if(o.faccionista_id){if(!byF[o.faccionista_id])byF[o.faccionista_id]={pcs:0,ops:[]};byF[o.faccionista_id].pcs+=o.total_pecas||0;byF[o.faccionista_id].ops.push(o.num);}});

  var div=document.createElement('div');div.className='g2';
  var form=document.createElement('div');form.className='card';
  form.innerHTML=`<div class="ct">Adicionar Faccionista</div>
    <div class="row r1"><div class="f"><label>Nome *</label><input id="fn" placeholder="Nome"></div></div>
    <div class="frow"><button class="btn ba" id="btn-fac">Adicionar</button></div>`;
  form.querySelector('#btn-fac').onclick=async()=>{
    var n=v('fn').trim();if(!n){alert('Informe o nome.');return;}
    await DB.from('faccionistas').insert({nome:n});alert('Adicionada!');pgCad('fac');
  };

  var lista=document.createElement('div');lista.className='card';lista.style.padding='0';
  lista.innerHTML=`<div style="padding:8px 12px;border-bottom:1px solid var(--b);font-size:12px;font-weight:700;color:var(--g)">Faccionistas (${facs.length})</div>
    <div class="tw"><table><thead><tr><th>Nome</th><th>Peças produzidas</th><th>OPs</th><th></th></tr></thead><tbody id="fac-rows"></tbody></table></div>`;

  div.appendChild(form);div.appendChild(lista);mc.appendChild(div);
  var tbody=lista.querySelector('#fac-rows');
  facs.forEach(f=>{
    var d=byF[f.id]||{pcs:0,ops:[]};
    var tr=document.createElement('tr');
    tr.innerHTML=`<td><b>${f.nome}</b></td><td style="font-weight:700;color:var(--g)">${d.pcs} peças</td><td style="font-size:11px;color:var(--m)">${d.ops.slice(0,5).join(', ')||'--'}</td><td></td>`;
    var bd=document.createElement('button');bd.className='btn br2 sm';bd.textContent='Excluir';bd.onclick=()=>{if(!confirm('Excluir '+f.nome+'?'))return;DB.from('faccionistas').delete().eq('id',f.id).then(()=>pgCad('fac'));};
    tr.lastElementChild.appendChild(bd);tbody.appendChild(tr);
  });
}

async function pgEst(){
  var [{data:est},{data:movs}]=await Promise.all([
    DB.from('estoque').select('*').order('material'),
    DB.from('movimentacoes_estoque').select('*').order('criado_em',{ascending:false}).limit(30)
  ]);
  est=est||[];movs=movs||[];
  var crit=est.filter(e=>(e.saldo||0)<=(e.estoque_minimo||0)&&(e.estoque_minimo||0)>0);
  var mc=g('mc');
  mc.innerHTML=`<b style="font-size:15px;color:var(--g)">Estoque</b>

async function entEst(){
  var mat=v('emm').trim();if(!mat){alert('Informe o material.');return;}
  var qtd=fv('emq');if(!qtd){alert('Informe a quantidade.');return;}
  var un=v('emu'),custo=fv('emc'),forn=v('emf'),min=fv('emmin');
  var {data:ex}=await DB.from('estoque').select('*').eq('material',mat).eq('unidade',un).maybeSingle();
  if(ex){var ns=(ex.saldo||0)+qtd,nm=ns>0?((ex.custo_medio||0)*(ex.saldo||0)+custo)/ns:0;
    await DB.from('estoque').update({saldo:ns,custo_medio:nm,estoque_minimo:min||ex.estoque_minimo||0}).eq('id',ex.id);
  }else{await DB.from('estoque').insert({material:mat,unidade:un,saldo:qtd,custo_medio:qtd>0?custo/qtd:0,estoque_minimo:min});}
  await DB.from('movimentacoes_estoque').insert({tipo:'entrada',material:mat,unidade:un,quantidade:qtd,custo_total:custo,fornecedor:forn,criado_por:U.nome});
  alert('Entrada registrada!');pgEst();
}
async function editEst(id,mat){

  openM(`<b style="font-size:14px;color:var(--g)">Editar: ${mat}</b>

      <div class="f"><label>Saldo atual</label><input type="number" id="ees" step="0.001" value="${e.saldo||0}"></div>

    </div>

  g('btn-sest').onclick=async()=>{await DB.from('estoque').update({saldo:fv('ees'),estoque_minimo:fv('eem')}).eq('id',_mid);closeM();alert('Atualizado!');pgEst();};

async function delEst(id,mat){if(!confirm('Excluir '+mat+'?'))return;await DB.from('estoque').delete().eq('id',id);pgEst();}

async function _pgTarHistorico(mc){
  // Filtros
  var filtros=document.createElement('div');filtros.className='card';
  filtros.innerHTML=`<div class="ct">Filtrar histórico</div>
    <div class="row r3">
      <div class="f"><label>Setor</label>
        <select id="hf-setor">
          <option value="">Todos os setores</option>
          <option value="corte">Corte</option>
          <option value="personalizacao">Personalização</option>
          <option value="artes">Artes</option>
          <option value="costura">Costura</option>
          <option value="revisao">Revisão/Expedição</option>
        </select>
      </div>
      <div class="f"><label>De</label><input type="date" id="hf-de" value="${new Date(Date.now()-30*864e5).toISOString().slice(0,10)}"></div>
      <div class="f"><label>Até</label><input type="date" id="hf-ate" value="${hoje()}"></div>
    </div>
    <div class="frow"><button class="btn ba" id="btn-hf-buscar">Buscar</button></div>`;
  mc.appendChild(filtros);

  var resultado=document.createElement('div');resultado.id='hist-resultado';mc.appendChild(resultado);

  async function buscarHist(){
    resultado.innerHTML=ld();
    var q=DB.from('tarefas').select('*').eq('status','concluida').order('concluida_em',{ascending:false}).limit(200);
    var setor=v('hf-setor'),de=v('hf-de'),ate=v('hf-ate');
    if(setor)q=q.eq('setor',setor);
    if(de)q=q.gte('concluida_em',de+'T00:00:00');

    var {data:hist}=await q;hist=hist||[];

    if(!hist.length){resultado.innerHTML='<div class="card" style="color:var(--m);font-size:12px;text-align:center;padding:20px">Nenhuma tarefa concluída no período.</div>';return;}

    var card=document.createElement('div');card.className='card';card.style.padding='0';
    card.innerHTML=`<div style="padding:8px 12px;border-bottom:1px solid var(--b);font-size:12px;font-weight:700;color:var(--g);display:flex;justify-content:space-between">
      <span>Tarefas concluídas (${hist.length})</span>

      <th>Concluída por</th><th>Observação</th><th>Criada por</th>
    </tr></thead><tbody id="hist-rows"></tbody></table></div>`;
    resultado.innerHTML='';resultado.appendChild(card);

    var tbody=card.querySelector('#hist-rows');
    var setorCls={corte:'bbl',personalizacao:'bwn',artes:'bpu',costura:'bnv',revisao:'bgy'};
    hist.forEach(t=>{
      var tr=document.createElement('tr');
      var dt=t.concluida_em?new Date(t.concluida_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'--';
      tr.innerHTML=`<td style="white-space:nowrap;font-size:11px">${dt}</td>
        <td><b>${t.titulo}</b></td>
        <td>${t.op_num?`<span class="badge bnv">${t.op_num}</span>`:'--'}</td>
        <td><span class="badge ${setorCls[t.setor]||'bgy'}">${t.setor}</span></td>

      tbody.appendChild(tr);
    });
  }

  filtros.querySelector('#btn-hf-buscar').onclick=buscarHist;
  buscarHist(); // carregar com filtros padrão
}

async function concTar(id,titulo){
  // Modal com campo de observação
  var obsConc=await new Promise(res=>{
    openM(`<b style="font-size:14px;color:var(--g)">Concluir tarefa</b>
      <div style="margin:10px 0 4px;font-size:12px;color:var(--m)">${titulo}</div>
      <div class="f" style="margin-top:12px"><label>Observação (opcional)</label>
        <textarea id="obs-conc" rows="3" placeholder="Ex: Peças separadas por cor, aguardando retirada..."></textarea>
      </div>
      <div class="frow">
        <button class="btn bs" onclick="closeM();_concRes(null)">Cancelar</button>
        <button class="btn ba" id="btn-conf-conc">Confirmar conclusão</button>
      </div>`);
    window._concRes=res;
    g('btn-conf-conc').onclick=()=>{var obs=v('obs-conc');closeM();res(obs);};
  });
  if(obsConc===null)return; // cancelado
  // Buscar dados da tarefa para saber a OP e etapa atual
  var {data:tarDet}=await DB.from('tarefas').select('op_num,setor').eq('id',id).single();
  // Marcar como concluída
  await DB.from('tarefas').update({status:'concluida',concluida_por:U.nome,concluida_em:new Date().toISOString(),obs_conclusao:obsConc||null}).eq('id',id);
  // Se tem OP vinculada, perguntar próxima etapa
  if(tarDet?.op_num){
    var {data:opAtual}=await DB.from('ops').select('etapa,num,cliente').eq('num',tarDet.op_num).single();
    if(opAtual){
      var etIdx=ETAPAS.indexOf(opAtual.etapa);
      var proxOpts=ETAPAS.slice(etIdx+1); // etapas disponíveis após a atual
      if(proxOpts.length>0&&opAtual.etapa!=='Concluída'){
        // Montar select das próximas etapas
        var optsHtml=proxOpts.map(e=>`<option value="${e}">${e}</option>`).join('');
        openM(`<b style="font-size:14px;color:var(--g)">Encaminhar OP ${opAtual.num}</b>
          <p style="font-size:12px;color:var(--m);margin:8px 0 14px">Tarefa concluída. Para qual etapa esta OP vai agora?</p>
          <div class="f" style="margin-bottom:14px"><label>Próxima etapa</label>
            <select id="prox-et">${optsHtml}</select>
          </div>
          <div class="frow">
            <button class="btn bs" onclick="closeM()">Só concluir</button>
            <button class="btn ba" id="btn-encaminhar">Encaminhar e criar tarefa</button>
          </div>`);
        g('btn-encaminhar').onclick=async()=>{
          var novaEtapa=g('prox-et').value;
          // Atualizar etapa da OP
          await DB.from('ops').update({etapa:novaEtapa}).eq('num',opAtual.num);
          // Criar tarefa automática para o setor da próxima etapa
          var novoSetor=ETAPA_SETOR[novaEtapa]||'corte';
          await DB.from('tarefas').insert({
            op_num:opAtual.num,
            titulo:`${novaEtapa} — OP ${opAtual.num} (${opAtual.cliente})`,
            descricao:`Tarefa criada automaticamente ao avançar de ${opAtual.etapa} para ${novaEtapa}.`,
            setor:novoSetor,prioridade:2,
            data_agendada:hoje(),status:'pendente',criado_por:U.nome
          });
          closeM();
          alert(`OP ${opAtual.num} encaminhada para ${novaEtapa}. Tarefa criada para o setor de ${novoSetor}.`);
          pgTar();return;
        };
      }
    }
  }
  var w=window.open('','_blank','width=380,height:420');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Comprovante</title><style>body{font-family:system-ui,sans-serif;padding:22px;max-width:340px;margin:0 auto;font-size:13px}.logo{background:#1a4a1f;color:#fff;padding:7px 12px;border-radius:5px;font-weight:800;display:inline-block;margin-bottom:14px}h2{color:#1a4a1f;margin-bottom:12px}.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee}.lbl{color:#888}.val{font-weight:700}@media print{button{display:none}}</style></head><body>
    <div class="logo">NorteSul Uniformes</div><h2>Comprovante de Conclusão</h2>
    <div class="row"><span class="lbl">Tarefa</span><span class="val">${titulo}</span></div>
    <div class="row"><span class="lbl">Setor</span><span class="val">${U.setor}</span></div>
    <div class="row"><span class="lbl">Por</span><span class="val">${U.nome}</span></div>
    <div class="row"><span class="lbl">Data/Hora</span><span class="val">${new Date().toLocaleString('pt-BR')}</span></div>
    ${obsConc?`<div class="row"><span class="lbl">Observação</span><span class="val">${obsConc}</span></div>`:''}
    <div style="text-align:center;margin-top:18px"><button onclick="window.print()" style="background:#1a4a1f;color:#fff;border:none;padding:9px 22px;border-radius:5px;font-size:13px;font-weight:700;cursor:pointer">Imprimir</button></div>
    </body></html>`);
  w.document.close();pgTar();
}

  lista.innerHTML=`<div class="tw"><table><thead><tr><th>Nome</th><th>Email</th><th>Nível</th><th>Setor</th><th>Status</th><th>Ações</th></tr></thead><tbody id="usr-rows"></tbody></table></div>`;
  mc.appendChild(lista);
  var tbody=lista.querySelector('#usr-rows');
  var nc={admin:'ca',supervisor:'cs',operacional:'co'};
  us.forEach(u=>{
    var tr=document.createElement('tr');
    tr.innerHTML=`<td><b>${u.nome}</b></td><td style="font-size:11px">${u.email}</td><td><span class="chip ${nc[u.nivel]||'co'}">${u.nivel}</span></td><td>${u.setor||'--'}</td><td><span class="badge ${u.ativo?'bok':'bred'}">${u.ativo?'Ativo':'Inativo'}</span></td><td></td>`;
    var td=tr.lastElementChild;
    var be=document.createElement('button');be.className='btn bs sm';be.textContent='Editar';be.onclick=()=>editUsr(u.id);td.appendChild(be);
    td.appendChild(document.createTextNode(' '));
    var br=document.createElement('button');br.className='btn bw2 sm';br.textContent='Reset';br.onclick=()=>{if(!confirm('Resetar senha de '+u.nome+' para 123?'))return;DB.from('usuarios').update({senha_hash:'a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3'}).eq('id',u.id).then(()=>alert('Senha resetada.'));};
    td.appendChild(br);tbody.appendChild(tr);
  });

  var addCard=document.createElement('div');addCard.className='card';addCard.style.marginTop='0';
  addCard.innerHTML=`<div class="ct">Adicionar usuário</div>
    <div class="row r3">
      <div class="f"><label>Nome *</label><input id="nun"></div>
      <div class="f"><label>Email *</label><input type="email" id="nue"></div>
      <div class="f"><label>Nível</label><select id="nul"><option value="supervisor">Supervisor</option><option value="operacional">Operacional</option><option value="admin">Admin</option></select></div>
    </div>
    <div class="row r1"><div class="f"><label>Setor</label><input id="nus" placeholder="Ex: corte, vendas"></div></div>
    <div class="alert ai">Senha inicial: <b>123</b></div>
    <div class="frow"><button class="btn ba" id="btn-add-usr">Adicionar</button></div>`;
  addCard.querySelector('#btn-add-usr').onclick=async()=>{
    var n=v('nun').trim(),e=v('nue').trim();if(!n||!e){alert('Preencha nome e email.');return;}
    var {error}=await DB.from('usuarios').insert({nome:n,email:e.toLowerCase(),senha_hash:'a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3',nivel:v('nul')||'operacional',setor:v('nus'),ativo:true});
    if(error){alert('Erro: '+error.message);return;}
    alert('Usuário criado! Senha: 123');pgUsr();
  };
  mc.appendChild(addCard);
}
async function editUsr(id){
  _mid=id;
  var {data:u}=await DB.from('usuarios').select('*').eq('id',id).single();if(!u)return;
  openM(`<b style="font-size:14px;color:var(--g)">Editar usuário</b>
    <div class="row" style="margin-top:12px">
      <div class="f"><label>Nome</label><input id="eun" value="${u.nome}"></div>
      <div class="f"><label>Email</label><input type="email" id="eue" value="${u.email}"></div>
    </div>
    <div class="row r3">
      <div class="f"><label>Nível</label><select id="eul"><option value="admin"${u.nivel==='admin'?' selected':''}>Admin</option><option value="supervisor"${u.nivel==='supervisor'?' selected':''}>Supervisor</option><option value="operacional"${u.nivel==='operacional'?' selected':''}>Operacional</option></select></div>
      <div class="f"><label>Setor</label><input id="eus" value="${u.setor||''}"></div>
      <div class="f"><label>Ativo</label><select id="eua"><option value="true"${u.ativo?' selected':''}>Sim</option><option value="false"${!u.ativo?' selected':''}>Não</option></select></div>
    </div>
    <div class="frow"><button class="btn bs" onclick="closeM()">Cancelar</button><button class="btn ba" id="btn-susr">Salvar</button></div>`);
  g('btn-susr').onclick=async()=>{
    var {error}=await DB.from('usuarios').update({nome:v('eun'),email:v('eue').toLowerCase(),nivel:v('eul'),setor:v('eus'),ativo:v('eua')==='true'}).eq('id',_mid);
    if(error){alert('Erro: '+error.message);return;}
    closeM();alert('Atualizado!');pgUsr();
  };
}

// ━━ AVISOS ━━
async function pgAvs(){
  var {data:avs}=await DB.from('avisos').select('*').order('criado_em',{ascending:false});avs=avs||[];
  var mc=g('mc');mc.innerHTML='';
  var hdr=document.createElement('div');
  hdr.innerHTML=`<b style="font-size:15px;color:var(--g)">Quadro de Avisos</b>`;
  mc.appendChild(hdr);

  // Form novo aviso
  var card=document.createElement('div');card.className='card';card.style.marginTop='10px';
  card.innerHTML=`<div class="ct">Novo aviso</div>
    <div class="row">
      <div class="f"><label>Título *</label><input id="av-tit" placeholder="Ex: Reunião amanhã"></div>
      <div class="f"><label>Cor de destaque</label>
        <select id="av-cor">
          <option value="#1a4a1f">Verde (padrão)</option>
          <option value="#b92c2c">Vermelho (urgente)</option>
          <option value="#8a5a00">Amarelo (atenção)</option>
          <option value="#1a4a8a">Azul (informação)</option>
        </select>
      </div>
    </div>
    <div class="row r1"><div class="f"><label>Mensagem *</label><textarea id="av-msg" rows="3" placeholder="Texto do aviso..."></textarea></div></div>
    <div class="frow"><button class="btn ba" id="btn-novo-av">Publicar aviso</button></div>`;
  card.querySelector('#btn-novo-av').onclick=async()=>{
    var tit=v('av-tit').trim(),msg=v('av-msg').trim();
    if(!tit||!msg){alert('Preencha título e mensagem.');return;}
    var {error}=await DB.from('avisos').insert({titulo:tit,mensagem:msg,cor:v('av-cor'),ativo:true,criado_por:U.nome});
    if(error){alert('Erro: '+error.message);return;}
    alert('Aviso publicado!');pgAvs();
  };
  mc.appendChild(card);

  // Lista
  var lista=document.createElement('div');lista.className='card';lista.style.padding='0';
  lista.innerHTML=`<div style="padding:8px 12px;border-bottom:1px solid var(--b);font-size:12px;font-weight:700;color:var(--g)">Avisos publicados (${avs.length})</div><div id="avs-list" style="padding:12px"></div>`;
  mc.appendChild(lista);
  var cont=lista.querySelector('#avs-list');
  if(!avs.length){cont.innerHTML='<div style="color:var(--m);font-size:12px">Nenhum aviso publicado.</div>';return;}
  avs.forEach(a=>{
    var div=document.createElement('div');
    div.style.cssText=`padding:10px 12px;border-left:4px solid ${a.cor||'var(--g)'};background:${a.cor?a.cor+'18':'var(--s2)'};border-radius:0 6px 6px 0;margin-bottom:10px;display:flex;align-items:flex-start;gap:10px`;
    div.innerHTML=`<div style="flex:1"><div style="font-weight:700;font-size:13px;color:${a.cor||'var(--g)'}">${a.titulo}</div><div style="font-size:12px;color:var(--m);margin-top:3px;white-space:pre-wrap">${a.mensagem}</div><div style="font-size:10px;color:var(--m);margin-top:5px">Por ${a.criado_por||'--'} · ${new Date(a.criado_em).toLocaleString('pt-BR')}</div></div>`;
    var btns=document.createElement('div');btns.style.display='flex';btns.style.gap='4px';
    var bst=document.createElement('button');bst.className='btn bw2 sm';bst.textContent=a.ativo?'Desativar':'Ativar';
    bst.onclick=async()=>{await DB.from('avisos').update({ativo:!a.ativo}).eq('id',a.id);pgAvs();};
    var bdl=document.createElement('button');bdl.className='btn br2 sm';bdl.textContent='Excluir';
    bdl.onclick=async()=>{if(!confirm('Excluir aviso?'))return;await DB.from('avisos').delete().eq('id',a.id);pgAvs();};
    btns.appendChild(bst);btns.appendChild(bdl);div.appendChild(btns);cont.appendChild(div);
  });
}

// ━━ MINHA CONTA ━━
function minhaContaModal(){
  openM(`<b style="font-size:14px;color:var(--g)">Minha conta</b>
    <div style="margin:12px 0 8px;padding:10px;background:var(--s2);border-radius:6px;font-size:12px">
      <div><b>${U.nome}</b></div>
      <div style="color:var(--m)">${U.email}</div>
      <div style="color:var(--m);margin-top:2px">Nível: ${U.nivel}${U.setor?' — '+U.setor:''}</div>
    </div>
    <div class="ct" style="margin-top:12px">Trocar senha</div>
    <div class="row r1"><div class="f"><label>Senha atual</label><input type="password" id="sa" placeholder="Senha atual"></div></div>
    <div class="row"><div class="f"><label>Nova senha *</label><input type="password" id="sn" placeholder="Mínimo 4 caracteres"></div>
    <div class="f"><label>Confirmar nova senha *</label><input type="password" id="sc" placeholder="Repita a nova senha"></div></div>
    <div class="alert ai" style="font-size:11px">A nova senha deve ter pelo menos 4 caracteres.</div>
    <div id="senha-err" class="alert ar" style="display:none;margin-top:6px"></div>
    <div class="frow"><button class="btn bs" onclick="closeM()">Cancelar</button><button class="btn ba" id="btn-trocar-senha">Salvar nova senha</button></div>`);
  g('btn-trocar-senha').onclick=trocarSenha;
}

async function trocarSenha(){
  var sa=g('sa').value,sn=g('sn').value,sc=g('sc').value;
  var err=g('senha-err');
  // Validar senha atual
  if(hashPwd(sa)!==U.senha_hash&&sa!=='123'){
    err.style.display='block';err.textContent='Senha atual incorreta.';return;
  }
  if(sn.length<4){err.style.display='block';err.textContent='A nova senha deve ter pelo menos 4 caracteres.';return;}
  if(sn!==sc){err.style.display='block';err.textContent='As senhas não coincidem.';return;}
  var novoHash=hashPwd(sn);
  var {error}=await DB.from('usuarios').update({senha_hash:novoHash}).eq('id',U.id);
  if(error){err.style.display='block';err.textContent='Erro ao salvar: '+error.message;return;}
  U.senha_hash=novoHash;saveS();
  closeM();alert('Senha alterada com sucesso!');
}

// init
window.onload=()=>{if(loadS()){rst();g('ls').style.display='none';g('sys').style.display='block';buildNav();go(U.nivel==='operacional'?'tar':'op');
  // Verificar avisos ativos
  setTimeout(async()=>{
    var {data:avs}=await DB.from('avisos').select('*').eq('ativo',true).order('criado_em',{ascending:false}).limit(5);
    if(avs&&avs.length){
      var html=avs.map(a=>`<div style="padding:10px 12px;border-left:4px solid ${a.cor||'var(--g)'};background:${a.cor?a.cor+'18':'var(--s2)'};border-radius:0 6px 6px 0;margin-bottom:8px"><div style="font-weight:700;font-size:13px;color:${a.cor||'var(--g)'}">${a.titulo}</div><div style="font-size:12px;color:var(--m);margin-top:3px">${a.mensagem}</div><div style="font-size:10px;color:var(--m);margin-top:4px">Por ${a.criado_por||'Admin'}</div></div>`).join('');
      openM(`<div style="text-align:center;margin-bottom:14px">
        <span style="font-size:22px">📢</span>
        <div style="font-size:15px;font-weight:800;color:var(--g);margin-top:4px">Quadro de Avisos</div>
      </div>
      ${html}
      <div class="frow" style="justify-content:center"><button class="btn ba" onclick="closeM()">Entendido</button></div>`);
    }
  },400);}else g('le').focus();};
</script>
