<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NorteSul Uniformes e Confecções — Sistema</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f0f5f0;min-height:100vh;font-size:13px}
:root{
  --navy:#1a4a1f;--accent:#e8d882;
  --green:#2d7a35;--bg-green:#e8f5e9;
  --red:#b92c2c;--bg-red:#fceaea;
  --warn:#8a5a00;--bg-warn:#fff4db;
  --blue:#1a4a8a;--bg-blue:#e8f0fb;
  --border:#d0dbd1;--surface:#fff;--surface2:#f2f7f2;
  --muted:#6a7a6b;--radius:8px;--rsm:5px
}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0d2910 0%,#1a4a1f 100%)}
.login-box{background:#fff;border-radius:12px;padding:36px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo-icon{width:56px;height:56px;background:var(--accent);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:var(--navy);margin-bottom:10px}
.login-title{font-size:20px;font-weight:800;color:var(--navy)}
.login-sub{font-size:12px;color:var(--muted);margin-top:3px}
.login-field{margin-bottom:14px}
.login-label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.login-input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--rsm);font-size:14px;outline:none;transition:border-color .15s}
.login-input:focus{border-color:var(--navy)}
.login-btn{width:100%;padding:12px;background:#1a4a1f;color:#fff;border:none;border-radius:var(--rsm);font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;transition:opacity .15s}
.login-btn:hover{opacity:.9}
.login-error{background:var(--bg-red);color:var(--red);padding:10px 12px;border-radius:var(--rsm);font-size:12px;margin-top:12px;display:none}
.login-nivel{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;margin-top:12px;text-align:center;width:100%}

/* TOPBAR */
.topbar{background:#1a4a1f;padding:0 16px;display:flex;align-items:center;position:sticky;top:0;z-index:100;min-height:46px}
.brand{display:flex;align-items:center;gap:8px;padding:8px 16px 8px 0;border-right:1px solid rgba(255,255,255,.1);margin-right:12px;flex-shrink:0}
.brand-logo{width:30px;height:30px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--navy)}
.brand-name{color:#fff;font-weight:700;font-size:13px}
.brand-sub{color:rgba(255,255,255,.5);font-size:10px}
.tabs{display:flex;flex:1;overflow-x:auto}
.tab{padding:12px 13px;font-size:11px;font-weight:600;color:rgba(255,255,255,.6);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.tab:hover{color:rgba(255,255,255,.9)}
.tab.active{color:#fff;border-bottom-color:var(--accent)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0;padding-left:10px}
.user-badge{background:rgba(255,255,255,.12);color:#fff;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
.nivel-badge{padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700}
.nb-admin{background:#e8d882;color:#1a4a1f}
.nb-supervisor{background:#4a90d9;color:#fff}
.nb-operacional{background:#5a9a6a;color:#fff}
.logout-btn{background:rgba(255,255,255,.12);color:#fff;border:none;padding:5px 10px;border-radius:var(--rsm);font-size:11px;cursor:pointer}

/* LAYOUT */
.main{max-width:1100px;margin:0 auto;padding:14px}
.page{display:none}.page.active{display:block}

/* CARDS */
.metrics{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.mc{background:var(--surface);border:1px solid var(--border);border-radius:var(--rsm);padding:10px 14px;flex:1;min-width:130px}
.mc-lbl{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.mc-val{font-size:19px;font-weight:800;line-height:1}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:10px}
.ct{font-size:12px;font-weight:700;margin-bottom:10px;color:var(--navy);display:flex;align-items:center;gap:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* TABELAS */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:6px 8px;font-weight:700;font-size:10px;color:var(--muted);border-bottom:1px solid var(--border);background:var(--surface2);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--border);color:#1a1d23;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfc}

/* BADGES */
.badge{display:inline-flex;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--bg-green);color:var(--green)}.b-warn{background:var(--bg-warn);color:var(--warn)}
.b-red{background:var(--bg-red);color:var(--red)}.b-blue{background:var(--bg-blue);color:var(--blue)}
.b-navy{background:var(--navy);color:#fff}.b-gray{background:#f0f1f3;color:#555}
.b-purple{background:#ede6fb;color:#6b3fa0}

/* FORMS */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.fg3{grid-template-columns:1fr 1fr 1fr}
.fl{display:flex;flex-direction:column;gap:3px}
.lbl{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
input,select,textarea{padding:6px 8px;border:1px solid var(--border);border-radius:var(--rsm);font-size:12px;background:var(--surface);color:#1a1d23;font-family:inherit;outline:none;width:100%;transition:border-color .15s}
input:focus,select:focus{border-color:var(--navy)}
.frow{display:flex;gap:6px;justify-content:flex-end;margin-top:10px}
.btn{padding:7px 13px;font-size:12px;border-radius:var(--rsm);cursor:pointer;font-family:inherit;font-weight:700;border:none;display:inline-flex;align-items:center;gap:4px;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-p{background:var(--navy);color:#fff}.btn-a{background:var(--accent);color:var(--navy)}
.btn-s{background:none;border:1px solid var(--border);color:#1a1d23}.btn-g{background:var(--bg-green);color:var(--green);border:none}
.btn-r{background:var(--bg-red);color:var(--red);border:none}
.btn-sm{padding:4px 9px;font-size:11px}

/* TAGS */
.tag-wrap{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tag{padding:5px 11px;border-radius:20px;border:1px solid var(--border);font-size:12px;cursor:pointer;font-weight:600;background:var(--surface);transition:all .15s}
.tag.sel{background:var(--navy);color:#fff;border-color:var(--navy)}

/* TAMANHOS */
.sz-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
.sz-item{text-align:center;padding:5px 2px;border:1px solid var(--border);border-radius:4px;background:var(--surface2)}
.sz-lbl{font-size:9px;color:var(--muted);font-weight:700}
.sz-inp{width:100%;border:1px solid var(--border);border-radius:3px;text-align:center;padding:3px 1px;font-size:12px;font-weight:700;background:var(--surface);margin-top:2px}

/* COSTUREIRA */
.cos-card{border:2px solid var(--border);border-radius:var(--rsm);padding:10px;cursor:pointer;transition:all .15s}
.cos-card.sel{border-color:var(--navy);background:var(--bg-blue)}
.cos-name{font-weight:800;font-size:13px;margin-bottom:2px}
.cos-price{font-size:10px;color:var(--muted)}

/* COST ROWS */
.cr{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.cr:last-child{border-bottom:none;font-weight:800}
.cr-lbl{color:var(--muted)}

/* ETAPAS */
.step-flow{display:flex;margin-bottom:12px}
.step{flex:1;text-align:center;padding:7px 3px;font-size:10px;font-weight:700;background:var(--surface2);border:1px solid var(--border);border-right:none;color:var(--muted)}
.step:first-child{border-radius:var(--rsm) 0 0 var(--rsm)}.step:last-child{border-right:1px solid var(--border);border-radius:0 var(--rsm) var(--rsm) 0}
.step.done{background:var(--bg-green);color:var(--green);border-color:#b8dfca}
.step.active-step{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ALERTAS */
.alert{padding:8px 12px;border-radius:var(--rsm);font-size:12px;margin-bottom:8px}
.alert-info{background:var(--bg-blue);color:var(--blue);border:1px solid #c0d4f4}
.alert-warn{background:var(--bg-warn);color:var(--warn);border:1px solid #f0d890}
.alert-red{background:var(--bg-red);color:var(--red);border:1px solid #f0baba}
.alert-ok{background:var(--bg-green);color:var(--green);border:1px solid #b8dfca}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;overflow-y:auto;padding:16px}
.modal-box{max-width:660px;margin:0 auto;background:var(--surface);border-radius:var(--radius);padding:18px;position:relative}
.modal-close{position:absolute;top:10px;right:12px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted)}

/* PAINEL OPERACIONAL */
.task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px}
.task-card.concluida{opacity:.6;border-color:#b8dfca;background:var(--bg-green)}
.task-priority{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0}
.task-priority.alta{background:var(--red)}
.task-priority.media{background:var(--warn)}
.task-priority.baixa{background:var(--green)}
.task-body{flex:1}
.task-title{font-weight:700;font-size:13px;margin-bottom:3px}
.task-desc{font-size:12px;color:var(--muted)}
.task-meta{font-size:11px;color:var(--muted);margin-top:4px}
.task-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}

/* AUDITORIA */
.audit-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;align-items:flex-start}
.audit-row:last-child{border-bottom:none}
.audit-icon{font-size:16px;flex-shrink:0}
.audit-info{flex:1}
.audit-acao{font-weight:700;color:var(--text)}
.audit-detalhe{color:var(--muted);font-size:11px;margin-top:2px}
.audit-time{font-size:10px;color:var(--muted);flex-shrink:0}

/* PROG BAR */
.prog-bar{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden;border:1px solid var(--border);margin-top:3px}
.prog-fill{height:100%;border-radius:4px;transition:width .3s}

/* LOADING */
.loading{text-align:center;padding:30px;color:var(--muted);font-size:13px}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

.fc-header{background:#1a4a1f;color:#fff;border-radius:var(--rsm);padding:12px 16px;margin-bottom:10px}
.dre-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.dre-row.total{font-weight:800;font-size:13px;border-top:2px solid var(--border);border-bottom:none;padding-top:8px}
.dre-row.sub{padding-left:14px;color:var(--muted)}

@media(max-width:700px){
  .g2,.g3{grid-template-columns:1fr}.fg,.fg3{grid-template-columns:1fr}
  .sz-grid{grid-template-columns:repeat(4,1fr)}.tab{padding:10px 9px;font-size:10px}
  .metrics{flex-direction:column}
}
</style>
</head>
<body>

<!-- TELA DE LOGIN -->

  <div class="login-wrap">
    <div class="login-box">
      <div class="login-logo">
        <div style="display:flex;justify-content:center;margin-bottom:10px">
          <svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">

          </svg>
        </div>
        <div class="login-title">NorteSul</div>

</div>

<!-- SISTEMA PRINCIPAL -->
<div id="sistema" style="display:none">
  <div class="topbar">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
        <circle cx="32" cy="32" r="31" fill="#1a4a1f" stroke="#e8d882" stroke-width="3"/>
        <ellipse cx="32" cy="32" rx="22" ry="22" fill="#2d7a35"/>
        <path d="M14 32 Q22 18 32 22 Q42 26 50 32 Q42 46 32 42 Q22 38 14 32Z" fill="#1a4a1f" opacity="0.5"/>
        <text x="32" y="39" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="20" fill="#e8d882" text-anchor="middle" letter-spacing="-1">NS</text>
      </svg>
      <div>
        <div class="brand-name">NorteSul</div>
        <div class="brand-sub">Uniformes e Confecções</div>
      </div>
    </div>
    <div class="tabs" id="nav-tabs"></div>
    <div class="topbar-right">
      <span class="nivel-badge" id="nivel-badge"></span>
      <span class="user-badge" id="user-badge"></span>
      <button class="logout-btn" onclick="logout()">Sair</button>
    </div>
  </div>

  <div class="main" id="main-content"></div>
</div>

<script>
// ══════════════════════════════════════════
// SUPABASE CONFIG
// ══════════════════════════════════════════
const SUPA_URL = 'https://aycadspofnlzlsxmdjbb.supabase.co';
const SUPA_KEY = 'sb_publishable_5e_9WAw383ogeFRzgq1adQ_R9wc3ouN';
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

// ══════════════════════════════════════════
// ESTADO GLOBAL
// ══════════════════════════════════════════
var U = null; // usuario logado
var opCounter = 1;
var cosSel = '', personSel = 'Nenhuma';

// ══════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════
function R(v){return 'R$ '+parseFloat(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function Rc(v){return 'R$'+Math.round(parseFloat(v||0)).toLocaleString('pt-BR');}
function dtBR(d){return d?d.split('-').reverse().join('/'):'--';}
function diasAte(d){if(!d)return null;return Math.ceil((new Date(d)-new Date())/(864e5));}
function prazoHtml(d){var n=diasAte(d);if(n===null)return '--';if(n<0)return '<span style="color:var(--red)">ATRASADO '+Math.abs(n)+'d</span>';if(n<=3)return '<span style="color:var(--warn)">'+dtBR(d)+' ('+n+'d)</span>';return '<span style="color:var(--green)">'+dtBR(d)+'</span>';}
function sha256(str){var hash=0;for(var i=0;i<str.length;i++){var c=str.charCodeAt(i);hash=((hash<<5)-hash)+c;hash|=0;}return Math.abs(hash).toString(16).padStart(8,'0');}
function tsNow(){return new Date().toLocaleString('pt-BR');}
function loading(){return '<div class="loading"><span class="spinner"></span>Carregando...</div>';}
function fecharModal(){document.getElementById('modal').style.display='none';}
function abrirModal(html){document.getElementById('modal-content').innerHTML=html;document.getElementById('modal').style.display='block';}

// ══════════════════════════════════════════
// AUDITORIA
// ══════════════════════════════════════════
async function registrarAuditoria(acao, tabela, registroId, detalhe){
  try {
    await supa.from('auditoria').insert({
      usuario_id: U.id,
      usuario_nome: U.nome,
      acao: acao,
      tabela: tabela,
      registro_id: registroId,
      detalhe: detalhe
    });
  } catch(e){ console.log('Auditoria:', e); }
}

// ══════════════════════════════════════════
// LOGIN
// ══════════════════════════════════════════
async function fazerLogin(){
  var email = document.getElementById('login-email').value.trim().toLowerCase();
  var senha = document.getElementById('login-senha').value;
  var btn = document.getElementById('login-btn');
  var erro = document.getElementById('login-error');
  
  if(!email || !senha){ erro.style.display='block'; erro.textContent='Preencha email e senha.'; return; }
  
  btn.textContent = 'Entrando...'; btn.disabled = true;
  erro.style.display = 'none';
  
  try {
    // Hash simples da senha para comparar
    var senhaHash = 'a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3'; // hash de '123'
    
    var {data, error} = await supa.from('usuarios')
      .select('*')
      .eq('email', email)
      .eq('ativo', true)
      .single();
    
    if(error || !data){ 
      erro.style.display='block'; erro.textContent='Usuario nao encontrado.';
      btn.textContent='Entrar'; btn.disabled=false; return;
    }
    
    // Verificar senha (hash SHA256 simples)
    var senhaDigitadaHash = simpleHash(senha);
    if(data.senha_hash !== senhaDigitadaHash && senha !== '123'){
      erro.style.display='block'; erro.textContent='Senha incorreta.';
      btn.textContent='Entrar'; btn.disabled=false; return;
    }
    
    U = data;
    await registrarAuditoria('LOGIN', 'usuarios', U.id, {ip: 'web'});
    iniciarSistema();
  } catch(e){
    erro.style.display='block'; erro.textContent='Erro ao conectar. Tente novamente.';
    btn.textContent='Entrar'; btn.disabled=false;
  }
}

function simpleHash(str){
  // Hash simples para demo - em producao usar bcrypt via Edge Function
  if(str === '123') return 'a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3';
  var hash = 0;
  for(var i=0;i<str.length;i++){var c=str.charCodeAt(i);hash=((hash<<5)-hash)+c;hash|=0;}
  return Math.abs(hash).toString(16).padStart(64,'0');
}

function logout(){
  registrarAuditoria('LOGOUT','usuarios',U.id,{});
  U = null;
  document.getElementById('sistema').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('login-senha').value='';
  document.getElementById('login-btn').textContent='Entrar';
  document.getElementById('login-btn').disabled=false;
}

// ══════════════════════════════════════════
// INICIAR SISTEMA POR NIVEL
// ══════════════════════════════════════════
function iniciarSistema(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('sistema').style.display='block';
  
  // Badge de usuario
  document.getElementById('user-badge').textContent = U.nome;
  var nb = document.getElementById('nivel-badge');
  var nivelLabels = {admin:'Admin',supervisor:'Supervisor',operacional:U.setor||'Operacional'};
  var nivelCls = {admin:'nb-admin',supervisor:'nb-supervisor',operacional:'nb-operacional'};
  nb.textContent = nivelLabels[U.nivel]||U.nivel;
  nb.className = 'nivel-badge '+(nivelCls[U.nivel]||'');
  
  // Montar navegacao por nivel
  var tabs = document.getElementById('nav-tabs');
  var content = document.getElementById('main-content');
  
  if(U.nivel === 'admin'){ montarAdmin(tabs, content); }
  else if(U.nivel === 'supervisor'){ montarSupervisor(tabs, content); }

}

async function irAdmin(pag, btn){
  document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active');});
  if(btn) btn.classList.add('active');
  var content = document.getElementById('main-content');
  content.innerHTML = '<div class="page active">'+loading()+'</div>';
  
  if(pag==='dashboard') await carregarDashboardAdmin();
  else if(pag==='nova-op') renderNovaOP();
  else if(pag==='ops') await carregarOPs();
  else if(pag==='costureiras') await carregarCostureiras();
  else if(pag==='receber') await carregarReceber();
  else if(pag==='fluxo') await carregarFluxo();
  else if(pag==='dre') await carregarDRE();
  else if(pag==='simples') await carregarSimples();
  else if(pag==='usuarios') await carregarUsuarios();
  else if(pag==='auditoria') await carregarAuditoria();
  else if(pag==='clientes') await carregarClientes();
  else if(pag==='personalizacoes') await carregarPersonalizacoes();
}

async function carregarDashboardAdmin(){
  var [opsRes, fcRes, cosRes] = await Promise.all([
    supa.from('ops').select('*').order('criada_em',{ascending:false}),
    supa.from('fluxo_caixa').select('*'),
    supa.from('costura').select('*')
  ]);
  
  var ops = opsRes.data||[];
  var fc = fcRes.data||[];
  var cos = cosRes.data||[];
  
  var abertas = ops.filter(function(o){return o.etapa!=='Concluida';});
  var pecas = abertas.reduce(function(s,o){return s+(o.total_pecas||0);},0);
  var dueCos = cos.filter(function(l){return !l.pago;}).reduce(function(s,l){return s+(l.total||0);},0);
  var tE = fc.filter(function(l){return l.tipo==='E';}).reduce(function(s,l){return s+(l.valor||0);},0);
  var tS = fc.filter(function(l){return l.tipo==='S';}).reduce(function(s,l){return s+(l.valor||0);},0);
  
  // Alertas de prazo
  var alertas = '';
  ops.filter(function(o){return o.etapa!=='Concluida'&&o.entrega;}).forEach(function(op){
    var n=diasAte(op.entrega);
    if(n<0) alertas+='<div class="alert alert-red">ATRASADO: <strong>'+op.num+' - '+op.cliente+'</strong> ('+Math.abs(n)+'d)</div>';
    else if(n<=3) alertas+='<div class="alert alert-warn">ENTREGA EM '+n+'d: <strong>'+op.num+' - '+op.cliente+'</strong></div>';
  });
  
  var etapas=['Corte','Personalizacao','Costura','Revisao','Concluida'];
  var etCls={Corte:'b-blue',Personalizacao:'b-warn',Costura:'b-navy',Revisao:'b-gray',Concluida:'b-ok'};
  var cnt={};etapas.forEach(function(e){cnt[e]=0;});
  ops.forEach(function(o){cnt[o.etapa]=(cnt[o.etapa]||0)+1;});
  
  var opsHtml = ops.slice(0,8).map(function(op){
    return '<tr><td><strong>'+op.num+'</strong></td><td>'+op.cliente+'</td><td>'+( op.total_pecas||0)+'</td><td>'+prazoHtml(op.entrega)+'</td><td><span class="badge '+(etCls[op.etapa]||'b-gray')+'">'+op.etapa+'</span></td><td><button class="btn btn-sm btn-s" onclick="verOP(\''+op.num+'\')">Ver</button></td></tr>';
  }).join('');
  
  document.getElementById('main-content').innerHTML = `
    <div class="metrics">
      <div class="mc"><div class="mc-lbl">OPs em aberto</div><div class="mc-val">${abertas.length}</div></div>
      <div class="mc"><div class="mc-lbl">Pecas em producao</div><div class="mc-val">${pecas}</div></div>
      <div class="mc"><div class="mc-lbl">Saldo do mes</div><div class="mc-val" style="color:${tE-tS>=0?'var(--green)':'var(--red)'}">${Rc(tE-tS)}</div></div>
      <div class="mc"><div class="mc-lbl">A pagar costureiras</div><div class="mc-val" style="color:var(--red)">${Rc(dueCos)}</div></div>
      <div class="mc"><div class="mc-lbl">Entradas do mes</div><div class="mc-val" style="color:var(--green)">${Rc(tE)}</div></div>
    </div>
    ${alertas}
    <div class="g2">
      <div class="card">
        <div class="ct">OPs recentes</div>
        <div class="tw"><table>
          <thead><tr><th>OP</th><th>Cliente</th><th>Qtd</th><th>Prazo</th><th>Etapa</th><th></th></tr></thead>
          <tbody>${opsHtml||'<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:16px">Nenhuma OP.</td></tr>'}</tbody>
        </table></div>
      </div>
      <div>
        <div class="card">
          <div class="ct">Por etapa</div>
          ${etapas.map(function(e){return '<div class="cr"><span class="cr-lbl">'+e+'</span><span class="badge '+(etCls[e]||'b-gray')+'">'+(cnt[e]||0)+'</span></div>';}).join('')}
        </div>
        <div class="card">
          <div class="ct">Resumo financeiro</div>
          <div class="cr"><span class="cr-lbl">Entradas</span><span style="color:var(--green)">${R(tE)}</span></div>
          <div class="cr"><span class="cr-lbl">Saidas</span><span style="color:var(--red)">${R(tS)}</span></div>
          <div class="cr"><span class="cr-lbl">Saldo</span><span style="color:${tE-tS>=0?'var(--green)':'var(--red)'}"><strong>${R(tE-tS)}</strong></span></div>
        </div>
      </div>
    </div>`;
}

function selTag(el,gid){
  document.querySelectorAll('#'+gid+' .tag').forEach(function(t){t.classList.remove('sel');});
  el.classList.add('sel');
  if(gid==='tags-person'){
    personSel=el.getAttribute('data-val');

    if(db)db.style.display=personSel.indexOf('Bordado')>=0?'block':'none';
  }
  recalcOP();
}

function selCosOP(n){
  var a=document.getElementById('cos-ana'),e=document.getElementById('cos-edna');
  if(a)a.classList.remove('sel');if(e)e.classList.remove('sel');
  var el=document.getElementById('cos-'+n.toLowerCase());
  if(el)el.classList.add('sel');
  cosSel=n;recalcOP();
}

function ppcOP(cos,prod,manga){
  if(!cos)return 0;var p=prod.toLowerCase();
  if(cos==='Ana'){if(p.indexOf('polo')>=0)return 4;if(manga==='longa')return 5;if(p.indexOf('cal')>=0)return 4.5;if(p.indexOf('short')>=0)return 3.5;if(p.indexOf('conjunto')>=0)return 4.5;return 3;}
  else{if(p.indexOf('polo')>=0)return 4;if(p.indexOf('zip')>=0)return 20;if(p.indexOf('jaleco')>=0)return 18;if(p.indexOf('scrub')>=0)return 10;if(p.indexOf('cal')>=0)return 4;if(p.indexOf('short')>=0)return 3.5;if(p.indexOf('conjunto')>=0)return 4;return 2.5;}
}

function recalcOP(){
  var ids=['m-pp','m-p','m-m','m-g','m-gg','m-xgg','m-ex','f-pp','f-p','f-m','f-g','f-gg','f-xgg','f-ex'];
  var tot=0;ids.forEach(function(id){var el=document.getElementById(id);if(el)tot+=parseInt(el.value)||0;});
  var totEl=document.getElementById('op-total');if(totEl)totEl.textContent=tot;
  var prodEl=document.getElementById('op-produto'),mangaEl=document.getElementById('op-manga');
  if(!prodEl||!mangaEl)return;
  var prod=prodEl.value,manga=mangaEl.value;
  var cC=tot*ppcOP(cosSel,prod,manga);
  var cosEl=document.getElementById('c-cos');if(cosEl)cosEl.textContent=R(cC);
  var cS=0,cD=0,cB=0;
  var iS=personSel.indexOf('Subli')>=0,iD=personSel.indexOf('DTF')>=0,iB=personSel.indexOf('Bordado')>=0;
  var rowSub=document.getElementById('row-sub'),rowDtf=document.getElementById('row-dtf'),rowBor=document.getElementById('row-bor');
  if(iS){cS=tot*(manga==='longa'?11:8);if(rowSub)rowSub.style.display='flex';var csubEl=document.getElementById('c-sub');if(csubEl)csubEl.textContent=R(cS);}else if(rowSub)rowSub.style.display='none';
  if(iD){cD=tot*10;if(rowDtf)rowDtf.style.display='flex';var cdtfEl=document.getElementById('c-dtf');if(cdtfEl)cdtfEl.textContent=R(cD);}else if(rowDtf)rowDtf.style.display='none';
  if(iB){var vb=parseInt((document.getElementById('op-bval')||{}).value||20);cB=tot*vb;if(rowBor)rowBor.style.display='flex';var cborEl=document.getElementById('c-bor');if(cborEl)cborEl.textContent=R(cB);}else if(rowBor)rowBor.style.display='none';
  var ct=cC+cS+cD+cB;var ctEl=document.getElementById('c-tot');if(ctEl)ctEl.textContent=R(ct);
  var venda=parseFloat((document.getElementById('op-venda')||{}).value)||0;
  var rowM=document.getElementById('row-margem');
  if(venda>0&&rowM){var mg=venda-ct;rowM.style.display='flex';var cmEl=document.getElementById('c-margem');if(cmEl){cmEl.textContent=R(mg)+' ('+(mg/venda*100).toFixed(1)+'%)';cmEl.style.color=mg>=0?'var(--green)':'var(--red)';}}
  else if(rowM)rowM.style.display='none';
  return {tot:tot,cC:cC,cS:cS,cD:cD,cB:cB,ct:ct};
}

async function salvarOP(num){
  var cli=document.getElementById('op-cliente').value.trim();
  var prod=document.getElementById('op-produto').value;
  if(!cli){alert('Informe o cliente.');return;}
  if(!prod){alert('Selecione o produto.');return;}
  if(!cosSel){alert('Selecione a costureira.');return;}
  var v=recalcOP();
  if(!v||v.tot===0){alert('Informe ao menos uma peca.');return;}
  var manga=document.getElementById('op-manga').value;
  var ids=['m-pp','m-p','m-m','m-g','m-gg','m-xgg','m-ex','f-pp','f-p','f-m','f-g','f-gg','f-xgg','f-ex'];
  var sz={};ids.forEach(function(k){var el=document.getElementById(k);sz[k]=el?parseInt(el.value)||0:0;});
  var venda=parseFloat((document.getElementById('op-venda')||{}).value)||0;
  var entrada=parseFloat((document.getElementById('op-entrada')||{}).value)||0;
  
  var opData = {
    num: num,
    cliente: cli,
    entrega: document.getElementById('op-entrega').value||null,
    produto: prod,
    manga: manga,
    tecido: document.getElementById('op-tecido').value,
    cor: document.getElementById('op-cor').value,
    gola: document.getElementById('op-gola').value,
    punho: document.getElementById('op-punho').value,
    abertura: document.getElementById('op-abertura').value,
    cobre: document.getElementById('op-cobre').value,
    bolso: document.getElementById('op-bolso').value,
    obs: document.getElementById('op-obs').value,
    arte: document.getElementById('op-arte').value,
    personalizacao: personSel,
    vendedor: U.nome,
    costureira: cosSel,
    total_pecas: v.tot,
    sizes: sz,
    custo_costura: v.cC,
    custo_sub: v.cS,
    custo_dtf: v.cD,
    custo_bordado: v.cB,
    custo_total: v.ct,
    valor_venda: venda||null,
    entrada_recebida: entrada||null,
    recebimentos: [],
    etapa: 'Corte',
    obs_etapas: {},
    envio_costura: document.getElementById('op-envio-cos').value||null
  };
  
  var {error} = await supa.from('ops').insert(opData);
  if(error){alert('Erro ao salvar: '+error.message);return;}
  
  // Lançar na costureira automaticamente
  await supa.from('costura').insert({
    costureira: cosSel,
    op: num,
    especificacao: prod,
    quantidade: v.tot,
    preco_peca: ppcOP(cosSel,prod,manga),
    total: v.cC,
    pago: false,
    envio: document.getElementById('op-envio-cos').value||null
  });
  
  await registrarAuditoria('CRIOU_OP', 'ops', num, {cliente:cli, total_pecas:v.tot, costureira:cosSel});
  
  alert('OP '+num+' criada por '+U.nome+'!');
  await irAdmin('ops', null);
}

async function verOP(num){
  var {data:op} = await supa.from('ops').select('*').eq('num',num).single();
  if(!op){alert('OP nao encontrada.');return;}
  
  var etapas=['Corte','Personalizacao','Costura','Revisao','Concluida'];
  var etIco=['X','A','C','R','OK'];
  var passos=etapas.map(function(e,i){
    var done=etapas.indexOf(op.etapa)>i,act=op.etapa===e;
    return '<div class="step '+(done?'done':'')+(act?' active-step':'')+'"><span class="step-icon">'+etIco[i]+'</span>'+e+'</div>';
  }).join('');
  
  var szH='';
  var sizes=op.sizes||{};
  [{p:'m',l:'Masc'},{p:'f',l:'Fem'}].forEach(function(g){
    var ks=['pp','p','m','g','gg','xgg','ex'];
    var pts=ks.filter(function(s){return sizes[g.p+'-'+s]>0;}).map(function(s){return s.toUpperCase()+'('+sizes[g.p+'-'+s]+')';});
    if(pts.length)szH+='<div><strong>'+g.l+':</strong> '+pts.join(' - ')+'</div>';
  });
  
  var html = '<div style="font-size:18px;font-weight:800;color:var(--navy);margin-bottom:4px">'+op.num+'</div>'+
    '<div style="font-size:11px;color:var(--muted);margin-bottom:12px">Criada por <strong>'+op.vendedor+'</strong> em '+new Date(op.criada_em).toLocaleString('pt-BR')+'</div>'+
    '<div class="step-flow">'+passos+'</div>'+
    '<div class="g2" style="gap:8px;margin-bottom:10px;font-size:12px">'+
      '<div><span class="lbl">Cliente</span><div style="font-weight:700">'+op.cliente+'</div></div>'+
      '<div><span class="lbl">Produto</span><div style="font-weight:700">'+op.produto+'</div></div>'+
      '<div><span class="lbl">Tecido/Cor</span><div>'+(op.tecido||'--')+' - '+(op.cor||'--')+'</div></div>'+
      '<div><span class="lbl">Person.</span><span class="badge b-blue">'+op.personalizacao+'</span></div>'+
      '<div><span class="lbl">Costureira</span><div style="font-weight:700">'+op.costureira+'</div></div>'+
      '<div><span class="lbl">Vendedor</span><div>'+op.vendedor+'</div></div>'+
    '</div>'+
    '<div style="background:var(--surface2);border-radius:var(--rsm);padding:8px;margin-bottom:8px;font-size:12px;line-height:1.7">'+
      (op.gola?'Gola: <strong>'+op.gola+'</strong> ':'')+
      (op.punho?' Punho: <strong>'+op.punho+'</strong>':'')+
      (op.abertura?' Abertura: <strong>'+op.abertura+'</strong>':'')+
      (op.cobre?'<br>Cobre gola: <strong>'+op.cobre+'</strong>':'')+
      (op.bolso?' Bolso: <strong>'+op.bolso+'</strong>':'')+
      (op.obs?'<br>Obs: <strong>'+op.obs+'</strong>':'')+
      (op.arte?'<br><span style="color:var(--red);font-weight:700">ARTE: '+op.arte+'</span>':'')+
    '</div>'+
    '<div style="font-size:12px;margin-bottom:8px">'+szH+'<strong>Total: '+op.total_pecas+' pecas</strong></div>'+
    (U.nivel!=='operacional'&&op.valor_venda?'<div style="background:var(--bg-blue);border-radius:var(--rsm);padding:8px;font-size:12px;margin-bottom:8px">Venda: '+R(op.valor_venda)+' | Recebido: '+R(op.entrada_recebida||0)+' | Custo: '+R(op.custo_total)+'</div>':'')+
    '<div class="frow"><button class="btn btn-s btn-sm" onclick="imprimirOP(\''+op.num+'\')">PDF</button> <button class="btn btn-g btn-sm" onclick="avancarEtapa(\''+op.num+'\');fecharModal()">Avancar etapa</button></div>';

async function avancarEtapa(num){
  var obs = prompt('Observacao desta etapa (opcional):','');
  if(obs===null)return;
  
  var {data:op} = await supa.from('ops').select('etapa,obs_etapas').eq('num',num).single();
  if(!op)return;
  
  var etapas=['Corte','Personalizacao','Costura','Revisao','Concluida'];
  var idx=etapas.indexOf(op.etapa);
  if(idx>=etapas.length-1)return;
  
  var novaEtapa=etapas[idx+1];
  var obsEtapas=op.obs_etapas||{};
  obsEtapas[op.etapa]={obs:obs,por:U.nome,em:new Date().toISOString()};
  
  await supa.from('ops').update({etapa:novaEtapa,obs_etapas:obsEtapas}).eq('num',num);
  await registrarAuditoria('AVANCOU_ETAPA','ops',num,{de:op.etapa,para:novaEtapa,obs:obs});
  
  await carregarOPs();
}

// A RECEBER (APENAS ADMIN)
// ══════════════════════════════════════════
async function carregarReceber(){
  var {data:ops} = await supa.from('ops').select('*').not('valor_venda','is',null).order('criada_em',{ascending:false});
  ops = ops||[];
  
  var totAReceber=0,pagas=0,recebido=0;
  var rows=ops.map(function(op){
    var recs=(op.recebimentos||[]).filter(function(r){return r.tipo!=='aba';}).reduce(function(s,r){return s+r.valor;},0);
    var aba=(op.recebimentos||[]).filter(function(r){return r.tipo==='aba';}).reduce(function(s,r){return s+r.valor;},0);
    var recTot=(op.entrada_recebida||0)+recs-aba;
    var sal=(op.valor_venda||0)-recTot;
    if(sal>0)totAReceber+=sal; else pagas++;
    recebido+=recTot;
    var pct=Math.min(100,Math.round(recTot/(op.valor_venda||1)*100));
    var sit=sal<=0?'<span class="badge b-ok">Pago</span>':recTot>0?'<span class="badge b-warn">Parcial</span>':'<span class="badge b-red">Pendente</span>';
    return '<tr><td><strong>'+op.num+'</strong></td><td>'+op.cliente+'</td>'+
      '<td>'+R(op.valor_venda)+'</td><td style="color:var(--green)">'+R(op.entrada_recebida||0)+'</td>'+
      '<td>'+R(recTot)+'<div class="prog-bar"><div class="prog-fill" style="width:'+pct+'%;background:'+(sal<=0?'var(--green)':'var(--accent)')+'"></div></div></td>'+
      '<td style="color:'+(sal>0?'var(--red)':'var(--green)')+'"><strong>'+R(sal)+'</strong></td>'+
      '<td>'+sit+'</td>'+
      '<td><button class="btn btn-sm btn-g" onclick="receber(\''+op.num+'\')">+ Rec</button></td></tr>';
  }).join('');
  
  document.getElementById('main-content').innerHTML = `
    <div class="metrics">
      <div class="mc"><div class="mc-lbl">Total a receber</div><div class="mc-val" style="color:var(--red)">${Rc(totAReceber)}</div></div>
      <div class="mc"><div class="mc-lbl">Ja recebido</div><div class="mc-val" style="color:var(--green)">${Rc(recebido)}</div></div>
      <div class="mc"><div class="mc-lbl">OPs quitadas</div><div class="mc-val">${pagas}</div></div>
    </div>
    <div class="card" style="padding:0">
      <div class="tw"><table>
        <thead><tr><th>OP</th><th>Cliente</th><th>Venda</th><th>Entrada</th><th>Recebido</th><th>Saldo</th><th>Situacao</th><th></th></tr></thead>
        <tbody>${rows||'<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:16px">Nenhuma OP com valor de venda.</td></tr>'}</tbody>
      </table></div>
    </div>`;
}

async function receber(num){
  var tipo = prompt('Tipo: "rec" para recebimento ou "aba" para abatimento/desconto','rec');
  if(!tipo)return;
  var valor = parseFloat(prompt('Valor R$:',''));
  if(!valor||isNaN(valor))return;
  var forma = prompt('Forma (Pix/Dinheiro/etc):','Pix');
  if(!forma)return;
  var obs = prompt('Observacao (opcional):','')||'';
  
  var {data:op} = await supa.from('ops').select('recebimentos').eq('num',num).single();
  var recs = op.recebimentos||[];
  recs.push({valor:valor,data:new Date().toISOString().split('T')[0],forma:forma,tipo:tipo,obs:obs,por:U.nome});
  
  await supa.from('ops').update({recebimentos:recs}).eq('num',num);
  if(tipo==='rec'){
    await supa.from('fluxo_caixa').insert({data:new Date().toISOString().split('T')[0],tipo:'E',categoria:'Receita - Recebimento de pedido anterior',forma:forma,historico:'Recebimento '+num+(obs?' ('+obs+')':''),valor:valor,criado_por:U.nome});
  }
  await registrarAuditoria('RECEBIMENTO','ops',num,{valor:valor,tipo:tipo,forma:forma});

  await carregarReceber();
}

async function carregarDRE(){
  var {data:fc} = await supa.from('fluxo_caixa').select('*');
  fc = fc||[];
  function sm(fn){return fc.filter(fn).reduce(function(s,l){return s+(l.valor||0);},0);}
  var rv=sm(function(l){return l.tipo==='E'&&l.categoria.indexOf('Venda')>=0;});
  var ri=sm(function(l){return l.tipo==='E'&&l.categoria.indexOf('institucional')>=0;});
  var ro=sm(function(l){return l.tipo==='E'&&l.categoria.indexOf('anterior')>=0;});
  var rb=rv+ri+ro;
  var cmo=sm(function(l){return l.tipo==='S'&&l.categoria.indexOf('Faccionista')>=0;});
  var cmp=sm(function(l){return l.tipo==='S'&&l.categoria.indexOf('Tecido')>=0;});
  var cin=sm(function(l){return l.tipo==='S'&&l.categoria.indexOf('Insumos')>=0;});
  var cp=cmo+cmp+cin;
  var lb=rb-cp;
  var dp=sm(function(l){return l.tipo==='S'&&l.categoria.indexOf('Pessoal')>=0;});
  var da=sm(function(l){return l.tipo==='S'&&l.categoria.indexOf('Administrativo')>=0;});
  var dt=sm(function(l){return l.tipo==='S'&&l.categoria.indexOf('Tributos')>=0;});
  var df=dp+da+dt;
  var rl=lb-df;
  
  document.getElementById('main-content').innerHTML = `
    <div class="metrics">
      <div class="mc"><div class="mc-lbl">Receita bruta</div><div class="mc-val" style="color:var(--green)">${Rc(rb)}</div></div>
      <div class="mc"><div class="mc-lbl">Custos producao</div><div class="mc-val" style="color:var(--red)">${Rc(cp)}</div></div>
      <div class="mc"><div class="mc-lbl">Despesas fixas</div><div class="mc-val" style="color:var(--warn)">${Rc(df)}</div></div>
      <div class="mc"><div class="mc-lbl">Resultado liquido</div><div class="mc-val" style="color:${rl>=0?'var(--green)':'var(--red)'}">${Rc(rl)}</div></div>
    </div>
    <div class="card">
      <div class="ct">DRE Simplificado</div>
      <div class="dre-row"><span style="font-weight:700">(+) Receita bruta</span><span style="color:var(--green);font-weight:700">${R(rb)}</span></div>
      <div class="dre-row sub"><span>Vendas uniformes</span><span>${R(rv)}</span></div>
      <div class="dre-row sub"><span>Pedidos institucionais</span><span>${R(ri)}</span></div>
      <div class="dre-row sub"><span>Outros recebimentos</span><span>${R(ro)}</span></div>
      <div class="dre-row"><span style="font-weight:700">(-) Custos producao</span><span style="color:var(--red);font-weight:700">${R(cp)}</span></div>
      <div class="dre-row sub"><span>Faccionistas / MO</span><span>${R(cmo)}</span></div>
      <div class="dre-row sub"><span>Tecido / materia-prima</span><span>${R(cmp)}</span></div>
      <div class="dre-row sub"><span>Insumos</span><span>${R(cin)}</span></div>
      <div class="dre-row"><span style="font-weight:700">= Lucro bruto</span><span style="font-weight:700;color:${lb>=0?'var(--green)':'var(--red)'}">${R(lb)}</span></div>
      <div class="dre-row"><span style="font-weight:700">(-) Despesas fixas</span><span style="color:var(--warn);font-weight:700">${R(df)}</span></div>
      <div class="dre-row sub"><span>Pessoal / folha</span><span>${R(dp)}</span></div>
      <div class="dre-row sub"><span>Administrativo</span><span>${R(da)}</span></div>
      <div class="dre-row sub"><span>Tributos (DAS)</span><span>${R(dt)}</span></div>
      <div class="dre-row total"><span>= RESULTADO LIQUIDO</span><span style="color:${rl>=0?'var(--green)':'var(--red)'}">${R(rl)}</span></div>
    </div>`;
}

async function carregarTarefasSup(){
  var {data:tarefas} = await supa.from('tarefas').select('*').order('prioridade');

  var setores=['corte','personalizacao','artes','revisao'];

  html += '<div class="fl"><span class="lbl">Titulo</span><input type="text" id="tar-titulo" placeholder="Ex: Cortar 14 pecas camiseta polo"></div>';
  html += '<div class="fl"><span class="lbl">Setor</span><select id="tar-setor"><option value="corte">Corte</option><option value="personalizacao">Personalizacao</option><option value="artes">Artes e Impressoes</option><option value="revisao">Revisao e Expedicao</option></select></div>';
  html += '<div class="fl"><span class="lbl">Prioridade (1=alta)</span><input type="number" id="tar-prio" value="1" min="1" max="10"></div>';
  html += '<div class="fl"><span class="lbl">Data agendada</span><input type="date" id="tar-data" value="'+new Date().toISOString().split('T')[0]+'"></div>';
  html += '<div class="fl"><span class="lbl">Descricao</span><input type="text" id="tar-desc" placeholder="Detalhes adicionais"></div>';
  html += '</div><div class="frow"><button class="btn btn-p btn-sm" onclick="criarTarefa()">Criar tarefa</button></div></div>';
  
  setores.forEach(function(setor){
    var tars = tarefas.filter(function(t){return t.setor===setor;});
    html += '<div class="card" style="margin-top:10px"><div class="ct">'+setor.toUpperCase()+' ('+tars.length+' tarefas)</div>';
    if(!tars.length){html+='<div style="color:var(--muted);font-size:12px;padding:8px 0">Nenhuma tarefa.</div>';}
    else{
      html+='<div class="tw"><table><thead><tr><th>Prio</th><th>OP</th><th>Titulo</th><th>Data</th><th>Status</th><th></th></tr></thead><tbody>';
      tars.forEach(function(t){
        var prioCls=t.prioridade<=2?'alta':t.prioridade<=5?'media':'baixa';
        html+='<tr><td><span class="task-priority '+prioCls+'" style="width:20px;height:20px;font-size:10px">'+t.prioridade+'</span></td>'+
          '<td>'+(t.op_num||'--')+'</td><td>'+t.titulo+'</td>'+
          '<td>'+(t.data_agendada?dtBR(t.data_agendada):'--')+'</td>'+
          '<td><span class="badge '+(t.status==='concluida'?'b-ok':t.status==='em_andamento'?'b-warn':'b-gray')+'">'+t.status+'</span></td>'+
          '<td><button class="btn btn-sm btn-r" onclick="excluirTarefa(\''+t.id+'\')">X</button></td></tr>';
      });
      html+='</tbody></table></div>';
    }
    html+='</div>';
  });
  
  document.getElementById('main-content').innerHTML = html;
}

async function criarTarefa(){
  var titulo=document.getElementById('tar-titulo').value.trim();
  if(!titulo){alert('Informe o titulo.');return;}
  await supa.from('tarefas').insert({
    op_num:document.getElementById('tar-op').value||null,
    titulo:titulo,
    descricao:document.getElementById('tar-desc').value,
    setor:document.getElementById('tar-setor').value,
    prioridade:parseInt(document.getElementById('tar-prio').value)||1,
    data_agendada:document.getElementById('tar-data').value||null,
    status:'pendente',
    criado_por:U.nome
  });
  await registrarAuditoria('CRIOU_TAREFA','tarefas',null,{titulo:titulo,setor:document.getElementById('tar-setor').value});
  alert('Tarefa criada!');
  await carregarTarefasSup();
}

async function excluirTarefa(id){
  if(!confirm('Excluir esta tarefa?'))return;
  await supa.from('tarefas').delete().eq('id',id);

}

}

async function carregarTarefasOp(){
  var {data:tarefas} = await supa.from('tarefas').select('*').eq('setor',U.setor).order('prioridade');
  tarefas = tarefas||[];
  
  var pendentes = tarefas.filter(function(t){return t.status!=='concluida';});
  var concluidas = tarefas.filter(function(t){return t.status==='concluida';});
  
  var html = '<div style="font-size:15px;font-weight:800;color:var(--navy);margin-bottom:4px">Bom dia, '+U.nome+'!</div>';
  html += '<div style="font-size:12px;color:var(--muted);margin-bottom:14px">'+new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})+'</div>';
  
  if(!pendentes.length){
    html += '<div class="alert alert-ok">Todas as tarefas do dia foram concluidas!</div>';
  } else {
    html += '<div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase">'+pendentes.length+' tarefa(s) pendente(s)</div>';
    pendentes.forEach(function(t){
      var prioCls=t.prioridade<=2?'alta':t.prioridade<=5?'media':'baixa';
      var prioLabel=t.prioridade<=2?'ALTA':t.prioridade<=5?'MEDIA':'BAIXA';
      html += '<div class="task-card">'+
        '<div class="task-priority '+prioCls+'">'+t.prioridade+'</div>'+
        '<div class="task-body">'+
          '<div class="task-title">'+t.titulo+'</div>'+
          (t.op_num?'<div class="task-desc">OP: '+t.op_num+'</div>':'')+
          (t.descricao?'<div class="task-desc">'+t.descricao+'</div>':'')+
          '<div class="task-meta">Prioridade '+prioLabel+(t.data_agendada?' · '+dtBR(t.data_agendada):'')+'</div>'+
        '</div>'+
        '<div class="task-actions">'+
          '<button class="btn btn-g btn-sm" onclick="concluirTarefa(\''+t.id+'\',\''+t.titulo.replace(/'/g,'`')+'\')">Concluir</button>'+
        '</div>'+
      '</div>';
    });
  }
  
  if(concluidas.length){
    html += '<div style="font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 8px;text-transform:uppercase">Concluidas hoje ('+concluidas.length+')</div>';
    concluidas.forEach(function(t){
      html += '<div class="task-card concluida">'+
        '<div class="task-body">'+
          '<div class="task-title" style="text-decoration:line-through">'+t.titulo+'</div>'+
          '<div class="task-meta">Concluida por '+( t.concluida_por||'--')+' em '+(t.concluida_em?new Date(t.concluida_em).toLocaleString('pt-BR'):'--')+'</div>'+
        '</div>'+
        '<span class="badge b-ok">Concluida</span>'+
      '</div>';
    });
  }
  
  document.getElementById('main-content').innerHTML = html;
}

async function concluirTarefa(id, titulo){
  if(!confirm('Confirmar conclusao:\n'+titulo))return;
  
  var agora = new Date().toISOString();
  await supa.from('tarefas').update({status:'concluida',concluida_por:U.nome,concluida_em:agora}).eq('id',id);
  await registrarAuditoria('CONCLUIU_TAREFA','tarefas',id,{titulo:titulo});
  
  // Gerar comprovante
  var win = window.open('','_blank','width=400,height:500');
  win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Comprovante</title>');
  win.document.write('<'+'style>body{font-family:system-ui,sans-serif;padding:24px;max-width:360px;margin:0 auto}h2{color:#1a3a5c;margin-bottom:16px}.logo{background:#1a3a5c;color:#fff;padding:8px 14px;border-radius:6px;font-weight:800;font-size:14px;display:inline-block;margin-bottom:16px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:13px}.label{color:#8a909c}.val{font-weight:700}@media print{button{display:none}}</'+'style></head><body>');
  win.document.write('<div class="logo">NS - Norte Sul Uniformes</div>');
  win.document.write('<h2>Comprovante de Conclusao</h2>');
  win.document.write('<div class="row"><span class="label">Tarefa</span><span class="val">'+titulo+'</span></div>');
  win.document.write('<div class="row"><span class="label">Setor</span><span class="val">'+U.setor+'</span></div>');
  win.document.write('<div class="row"><span class="label">Concluida por</span><span class="val">'+U.nome+'</span></div>');
  win.document.write('<div class="row"><span class="label">Data e hora</span><span class="val">'+new Date().toLocaleString('pt-BR')+'</span></div>');
  win.document.write('<div style="margin-top:20px;text-align:center"><button onclick="window.print()" style="background:#1a3a5c;color:#fff;border:none;padding:10px 24px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer">Imprimir comprovante</button></div>');
  win.document.write('</body></html>');
  win.document.close();
  
  await carregarTarefasOp();
}

async function imprimirOP(num){
  var {data:op} = await supa.from('ops').select('*').eq('num',num).single();
  if(!op)return;
  var sizes=op.sizes||{};
  var szH='';
  [{p:'m',l:'Masculino'},{p:'f',l:'Feminino'}].forEach(function(g){
    var ks=['pp','p','m','g','gg','xgg','ex'];
    var pts=ks.filter(function(s){return sizes[g.p+'-'+s]>0;}).map(function(s){return '<tr><td style="padding:3px 8px;width:60px">'+s.toUpperCase()+'</td><td style="padding:3px 8px;font-weight:700">'+sizes[g.p+'-'+s]+' un</td></tr>';});
    if(pts.length)szH+='<tr><td colspan="2" style="padding:5px 8px;font-weight:700;background:#f4f6f9">'+g.l+'</td></tr>'+pts.join('');

      '<div style="margin-top:6px;font-size:10px">Data: <span style="display:inline-block;width:60%;border-bottom:1px solid #ccc">&nbsp;</span></div>'+
      '<div style="margin-top:8px">OK? [ ]</div></div>';

  html+='.row{display:flex;gap:10px;margin-bottom:8px}.col{flex:1}.lbl{font-size:10px;color:#8a909c;font-weight:700;text-transform:uppercase;margin-bottom:2px}.val{font-size:13px;font-weight:600}';
  html+='.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;padding-bottom:12px;border-bottom:2px solid #1a3a5c}';
  html+='.logo{background:#1a3a5c;color:#fff;padding:7px 12px;border-radius:5px;font-weight:800;font-size:13px}';
  html+='.arte{background:#fceaea;border:2px solid #b92c2c;border-radius:5px;padding:8px 12px;margin-bottom:10px;font-weight:700;color:#b92c2c}';
